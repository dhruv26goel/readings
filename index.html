    "md": "# 7+ million Postgres tables\n_FOSS United · Kailash Nadh (IndiaFOSS 2024) · deep-dive (extreme-scale report serving) · Read time: ~7 min_\n\n**Theme.** Report-serving at huge scale is solved by *never letting users touch the slow database*. Queue the expensive query, then materialise each result as its own small throwaway table in a cheap, disposable cache database.\n\n---\n\n### 1. Decouple the request rate from the database's capacity\n_A synchronous call welds the arrival rate of demand to the service rate of the backend — so put a buffer between them._\n\n**The setup.** Synchronous reports mean every click holds an app connection open on a 10–30s query. At tens of thousands of requests/sec this \"snowballs\" the database. The fix is a separate middleware (\"Dung Beetle\", ~1,700 lines of Go): it accepts a job over a trivial HTTP API, returns \"queued\" instantly, and drains the queue into the big databases at the rate *they* can handle. The app polls for status; any language can use it.\n\n**Why it works (first principles).** A synchronous call ties demand's arrival rate to the backend's service rate, and the slow query becomes the latency of the whole request path. When arrivals exceed service rate, queues grow without bound — and they grow in the *worst* place: open connections and threads that each consume memory and DB slots, whose contention slows the queries further, so the overload feeds itself. An explicit queue changes *where* the wait happens: demand spikes fill a cheap, bounded buffer, and the expensive resource is admitted at a rate you choose (admission control / backpressure). Pulling this into one process also means queueing, pooling and driver quirks aren't re-implemented per language, and the reporting layer scales independently of the app tier. Queues can be split by job weight (a heavy queue with 10 workers, a light one with 2) so fast queries don't wait behind slow ones — i.e. you kill head-of-line blocking.\n\n**When & what it costs.** When a backend has a hard capacity ceiling and bursty demand, ask *who absorbs the burst* — if the answer is \"the database,\" add a buffer and make completion async. The user's wait is the same or longer; it just happens somewhere cheap.\n\n---\n\n### 2. A results *store*, not a cache entry: one table per (user, report) result\n_When an expensive computation yields a tiny result, materialise the result in a queryable form and you get all downstream interaction for free._\n\n**The setup.** Each finished query is written to a *brand-new Postgres table* in a separate results DB; the app then does a plain `select *` on it. Nadh calls it \"the biggest hacky aspect.\" Results are small (hundreds–thousands of rows) even though they scanned hundreds of billions. A column-type map translates whatever the source driver (Postgres, ClickHouse, MariaDB) returns into the results table's schema.\n\n**Why it works (first principles).** The key fact is the *asymmetry between work and output*: computing a report touches an enormous amount of data, but the answer is tiny — so you pay the expensive part once and keep the small result in a general-purpose DB. A fresh table per result needs *no key design, no serialisation format, and no invalidation*: each result is an immutable snapshot whose identity is simply its table name. And unlike a key-value blob, it's *queryable* — follow-up sort/filter/pagination run as SQL against the small table, so the main database is never touched again for the session. That's the real saving: one expensive read becomes many cheap interactions. The type map is the glue: SQL result columns are self-describing, so the cache schema is derived mechanically from any source, making the cache layer source-agnostic. The cost is catalog bloat — Postgres keeps per-table/per-column metadata (`pg_attribute` alone ~48GB, ~60GB total), acceptable only because the DB is disposable and the access pattern is narrow (create, read by exact name, discard).\n\n**When & what it costs.** When an expensive computation yields a small result, consider materialising it *queryably* rather than as a blob. Check that the hidden cost (here, catalog size) lands somewhere you can afford — the ephemerality is what makes it affordable.\n\n---\n\n### 3. Design for disposal: reset instead of delete\n_Deleting N things is O(N); replacing the container that holds all N is O(1)._\n\n**The setup.** At 7M+ tables, `DROP TABLE` or scanning can't finish in reasonable time. So every night they *stop Postgres, detach the disk, attach a fresh one, and bring it up* — seconds. The results DB is explicitly \"throwaway.\" Even with ~60GB of catalog metadata, a restart takes ~3 seconds.\n\n**Why it works (first principles).** Deleting N items costs O(N): catalog lookups, locks, WAL, file unlinks. Replacing the *container* is O(1). The principle: match your cleanup granularity to your data's lifecycle — if everything shares one expiry boundary (\"all of yesterday's data\"), per-item delete is wasted effort; discard at the level of the whole volume. (Same idea as partition-drop vs row-delete, or immutable infrastructure vs patching in place.) It only works because the store holds *derived* data — the source of truth is elsewhere, so losing the whole thing is cheap and recoverable by recomputation. Separately, the fast restart shows catalog size and boot time are *decoupled* in Postgres: a large-but-cold catalog isn't scanned at startup.\n\n**When & what it costs.** If data has a uniform lifetime and is reproducible, destroy at the coarsest granularity you have (volume, partition, instance). First check the store really is derived and disposable.\n\n---\n\n### 4. \"Abuse\" as engineering: push a mature tool into an unintended regime, contained\n_The documented \"design intent\" describes the regime the developers tested, not the full envelope of what works._\n\n**The setup.** Nadh frames this (and a prior \"DNS-as-weather-API\" talk) as \"software abuse.\" It started as a hack and now underpins the firm's financial reporting: a single 64-vCPU/128GB node holds ~7M tables on an average day, more on volatile days. The justification: \"why not? If Postgres works beautifully.\"\n\n**Why it works (first principles).** The limits of a mature system are softer and more workload-specific than its docs imply. A boring, well-understood tool used strangely often beats a purpose-built system, because you inherit its durability, tooling and operational knowledge. Behaviour at the edge is the unknown — but the cost of discovery is *bounded* when the use is isolated and disposable (here, the throwaway results DB, whose failure only means recomputing). The hack also grew by *observation*: 10k tables → 50k → 1M → 11M+, each stage staying within what the system demonstrably took, with the limit found empirically rather than predicted.\n\n**When & what it costs.** Before reaching for a new specialised system, ask whether the mature tool you already run handles the unusual regime — but contain the experiment so failure is cheap, and scale step by step while watching behaviour. The evidence here is \"it worked for us,\" not a proof it generalises (the talk gives no failure modes or monitoring).\n\n---\n\n## New concepts (learned today)\n- **Request-rate/backend-capacity decoupling (async queue + poll)** — put a queue between demand and a capacity-limited backend; return \"queued\" at once, drain at the sustainable rate, clients poll. Spikes fill a cheap buffer instead of piling up as connections that worsen the overload. Split queues by job weight to kill head-of-line blocking.\n- **Table-per-result materialisation (ephemeral results DB)** — write each expensive query's small result into its own new table in a disposable DB; reads and follow-up sort/filter are plain SQL; no invalidation (snapshots are immutable); price is catalog bloat; a source→target column-type map makes it work across heterogeneous databases.\n- **Reset-not-delete (volume swap as bulk cleanup)** — when everything expires together and is reproducible, discard by swapping the whole disk/instance in O(1) rather than dropping items one-by-one in O(N).\n- **Catalog bloat vs boot time (Postgres)** — per-column catalog metadata grows with table count (~60GB at 7M tables) yet restart stays ~3s; catalog size is not the startup cost (single-source observation).\n\n## Connections\n- The cache rests on the same base as **skewed-access tiering**: pay the expensive read once, serve repeats cheaply — but here the cache is *per user, per request*, not shared by popularity.\n- \"Reset-not-delete\" and \"design from the disposable end-state\" echo the **derive-from-the-end-state** habit seen across this run's infra talks (PhonePe's irreversibility-first design, IRCTC's freeze-then-assign).\n\n## Left out\nThe dung-beetle naming/strength analogy, the title-revision jokes, and the generic \"banks have separate UIs for old reports\" aside — no mechanism. Kept OLTP/OLAP and read-replica background only as context (profile treats Postgres as known)."

    "md": "# How JioCinema live-streams IPL to 20 million concurrent devices\n_Arpit Bhayani (Asli Engineering), with Prachi Sharma · deep-dive (live-streaming at event scale) · Read time: ~10 min_\n\n**Theme.** When your load is a *known, synchronised, unforgiving spike*, the engineering problem stops being \"scale reactively\" and becomes \"know your limits in advance, degrade on purpose, and keep the one critical path alive at any cost.\"\n\n---\n\n### 1. Load is a function of *game state*, so capacity planning is per-endpoint arithmetic\n_Concurrency is just a headline; what loads a service is concurrency × the chance users hit *that* endpoint × the fan-out beneath it._\n\n**The setup.** There's no magic sizing formula. Each service owner starts from one pod at ~60% CPU, works out how many requests survive CDN offload to reach the origin, multiplies by DB calls per request (say 3), and adds buffer. Different APIs spike at different instants: video playback when a star batsman walks in; home-page APIs when he's out (\"brace for impact\").\n\n**How it works.** You size by *tracing one user action through every hop* and multiplying out: CDN miss-rate → origin RPS → DB calls per request → downstream fan-out. The 60% target is really a headroom decision — room bought against a correlated step-change you can't react to in time. Every hop gets a known breaking point, including the cloud provider's own capacity, which has to be arranged in advance (the platform sometimes eats a large share of the country's bandwidth).\n\n**Why it works (first principles).** Averages assume independence — different users doing different things, so load smooths out. A synchronised audience breaks that assumption: everyone does the same thing at the same instant, so load doesn't average, it *concentrates*, and it moves between endpoints as the match narrative moves people around the app. \"We can scale\" is a claim to be *bounded*, not trusted — find the number at which each hop stops.\n\n**When & what it costs.** Any correlated-demand system (live events, flash sales). Cost: real per-service benchmarking and getting partners (CDN, cloud, gateways) to audit against your stated peak, not theirs.\n\n---\n\n### 2. Reactive autoscaling is a control loop slower than the event\n_If adding capacity takes longer than the surge lasts, the autoscaler always arrives after the fire._\n\n**The setup.** Autoscaling doesn't work for them. In one unplanned spike a database hit 100% CPU and took 45 minutes to add five nodes — by which time half the game was over. So databases are *pre-scaled* hours ahead, never scaled down mid-match, and stepped down afterward in \"ladders.\" Buffers are tuned over a season to survive ~2× the previous day's peak.\n\n**How it works.** Treat the stateful layer as the long pole: provision it ahead of the known schedule (feedforward — see the Hotstar and Pragmatic digests for the same principle), shed load while capacity catches up, and shrink only gradually afterward.\n\n**Why it works (first principles).** Autoscaling is *feedback control with delay*: detect → decide → provision → warm → rebalance. It only works when provisioning delay ≪ the load's rise time. Stateful systems have large delays because data must be copied and replicas rebalanced — and adding capacity can itself add load while it happens. The no-scale-down rule is asymmetric cost: over-provisioning for a few hours costs a bounded sum; a premature scale-down before a second wave risks the whole event.\n\n**When & what it costs.** Predictable/scheduled spikes on stateful tiers. Cost: you pay for peak capacity you hold idle, and you need an empirical, season-long tuning loop.\n\n---\n\n### 3. Degradation is a pre-built, tiered, *invisible* fallback ladder\n_Priorities are only real if they're encoded as a shed order — what you drop first when you run out._\n\n**The setup.** Features are tiered P0 (playback, ads), P1 (personalisation), P2 (nice-to-have). P1/P2 failures are logged to metrics but *never shown as an error* to the user. For DB trouble they raise cache TTLs, accepting minutes of staleness. The last resort is **panic mode**: swap the CDN origin to *pre-snapshotted static responses* of catalog and playback APIs, generated and automated ahead of time. In a real match where it fired, customer support logged zero complaints.\n\n**How it works.** For each feature, decide in advance what its static or stale version looks like and who can flip it. A snapshot of an API response is a *precomputed answer* — it cuts the dependency on origin and DB entirely, turning that load into the cheapest thing infrastructure serves: a static file.\n\n**Why it works (first principles).** Under overload you either degrade everything at random or degrade chosen things deliberately; only the second is a strategy, and it works because value is wildly concentrated (almost everyone wants playback). TTL extension is the same trade in milder form — spend consistency to buy availability, at an exchange rate that differs by data type (a view counter can be approximate). \"Don't tell the user\" treats the error message itself as part of the failure: users can't act on it and it only spreads panic.\n\n**When & what it costs.** Works where value is concentrated and fallbacks can be enumerated ahead. Only per-*cohort* data can be snapshotted — per-user personalisation can't. And it must be rehearsed and automated, because \"during an incident you don't design, you execute.\"\n\n---\n\n### 4. Clients are part of your load generator — so cap retries and ship a kill switch\n_A well-meaning \"retry 3×\" in a 20M-user app triples your load at the exact moment you're failing._\n\n**The setup.** They cap retries and use capped exponential backoff. Every change ships behind a feature flag (keyed on app version, geography, platform) so it can be turned off *mid-match* in seconds. Client failure modes (5xx, latency, DNS failure, and combinations) are simulated with a proxy tool before the season.\n\n**Why it works (first principles).** Retries are *positively-correlated demand*: failure produces more requests, which produces more failure — a feedback loop with gain > 1, which is why systems *tip over* instead of degrading gracefully. Backoff with a cap lowers the gain and spreads retries across time; it's valid only where the user can tolerate delay (live-video buffering provides that slack). Feature flags change the unit of rollback from a deploy (slow, risky) to a config flip (seconds) — decisive when the incident window is a three-hour show.\n\n**When & what it costs.** Any high-fan-in client/server system. Cost: you must build the flag plumbing and the fault-injection harness, and test *combinations* of failures, not single ones.\n\n---\n\n### 5. Cache offload is the real engineering, and fan-out × hot keys is the hidden killer\n_TTL only helps repeat visitors; a live event is full of first-timers with cold caches, so you must cut request *count*, not just lengthen TTL._\n\n**The setup.** \"Real engineering\" starts when CDN offload drops below 90%. In one incident the image CDN hit 90% CPU: a \"stickers\" feature made each client pull ~50 small images, and a few dozen images were absorbing ~1M+ RPS. The fix wasn't a bigger TTL — it was *bundling* the stickers (already base64, since they were shareable) into one API response, cutting ~10M RPS to ~100k. Multi-CDN is mandatory (CDNs have hard limits too), with a backend-driven optimiser steering traffic by CDN heat and regional outages.\n\n**Why it works (first principles).** Edge load = requests-per-user × users × *key concentration*. A feature that looks cheap alone multiplies the first term, and a synchronised audience makes the same small key-set hot for *everyone at once*. Reducing request count (bundling, sprites, inlining) beats raising TTL, because TTL only helps repeats while a live event is mostly cold first-time fetches. Steering belongs in the backend (the URL you return *is* the routing decision), so you can re-route without shipping a new client.\n\n**When & what it costs.** Asset-heavy features under synchronised load. Cost: estimate edge requests *per session*, not just bytes, and treat offload % as a first-class health signal (it governs both cost and origin risk).\n\n---\n\n### 6. Failures *outside your boundary* look like silence from inside\n_Server dashboards see only the requests that arrive; a failure upstream of your ingress erases its own evidence._\n\n**The setup.** Support got reports of the app not opening for some users. End-to-end server tracing (CDN → LB → backend) showed nothing wrong. A colleague then reproduced it for their *whole building*: a smaller ISP had stale DNS entries, so a couple of domains wouldn't resolve. Switching to 8.8.8.8 fixed it; they added fallback DNS resolvers into the client.\n\n**Why it works (first principles).** Server-side observability suffers survivorship bias — it can only measure requests that made it in. A name-resolution or ISP-routing failure happens *before* ingress, so you get green dashboards beside unhappy users. The diagnosis move is to correlate the failing population by *shared environment* (a building, an ISP), not by software version. And since you can't coordinate with every ISP, you push resilience to the end you control — the client — with a redundant alternative for each external dependency on the path.\n\n**When & what it costs.** Any system with a client you ship over hostile last-mile networks. Cost: client-side fallbacks for each assumed external dependency (resolvers, etc.).\n\n---\n\n### 7. Ad insertion is a spectrum between over-delivery and per-user cost — cohorts sit in the middle\n_When per-item decisions are too expensive in a bounded time window, pick the coarsest grouping that still preserves the value being sold._\n\n**The setup.** Static insertion (one ad for everyone) over-delivers against what the advertiser bought. Fully personalised is too slow/costly at scale. Client-side insertion breaks under adaptive-bitrate shifts. So they use *server-side ad insertion (SSAI) with cohort targeting* (geography, interest groups).\n\n**Why it works (first principles).** The constraint is a *contract* (impressions promised) against a real-time decision budget. Personalisation granularity trades decision cost for targeting precision; with tens of millions in sync, per-user decisions have a brutally short deadline. Cohorts cut the number of distinct decisions while keeping the value the advertiser pays for. Server-side stitching also keeps the ad in the same stream as the content, dodging client player-state problems.\n\n**When & what it costs.** Any bounded-time, contract-driven decision at scale. Cost: you give up per-user precision for decision throughput.\n\n---\n\n## New concepts (learned today)\n- **Retry gain / retry amplification** — client retries make demand *rise* when the system is failing; N retries multiply load up to N× at the worst moment, a positive feedback loop that turns degradation into collapse. Capped exponential backoff lowers the gain.\n- **Panic mode (static-snapshot origin failover)** — pre-generate snapshots of cacheable API responses on static storage; in an emergency repoint the CDN from live origin to those snapshots, so the user-visible subset works with zero DB/origin load. Only non-per-user endpoints qualify; must be rehearsed.\n- **Request-count reduction over TTL (cold-visitor cache problem)** — in a live event full of first-time visitors, longer TTLs only help repeats; collapsing many small object fetches into one (bundle, sprite, inline base64) cuts edge load at its source.\n- **Cohort server-side ad insertion (SSAI)** — stitch ads into the stream on the server, targeted per cohort not per user; avoids static over-delivery and per-user decision cost while keeping targeting.\n- **Upstream-of-ingress failure invisibility** — failures before a request reaches your servers (DNS, ISP) leave no server-side trace; diagnose by what the failing users *share*, and add client-side redundancy for external path dependencies.\n\n## Connections\n- Ideas 1–3 are the same spine as the **Hotstar** and **Pragmatic Engineer live-streaming** digests this run: *feedforward over feedback*, *per-journey capacity arithmetic*, and *pre-declared tiered degradation*. Three independent teams converged on the identical playbook — strong signal it's the real structure of event-scale load, not one shop's taste.\n- The hot-key point (5) is the edge-side cousin of **skewed-access** thinking: access *concentration*, not average, dominates cost.\n\n## Left out\nThe war-room ritual and day-one atmosphere (colour, no mechanism), the Kafka prioritisation aside (P0 first, defer P1/P2), and the hiring pitch."
  }
]</script>
<script>
const DIGESTS = JSON.parse(document.getElementById('data').textContent);
const CAT_ORDER = ['Engineering/Product','HR/Culture','Sales','General'];
const CAT_CLASS = {'Engineering/Product':'c-eng','HR/Culture':'c-hr','Sales':'c-sales','General':'c-gen'};
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const listEl=document.getElementById('list'), docEl=document.getElementById('doc'),
      qEl=document.getElementById('q'), nEl=document.getElementById('n'),
      chipsEl=document.getElementById('chips'), groupSeg=document.getElementById('groupSeg');
let groupBy='category', filter=null, activeId=null;

const ACR=new Set(['ai','llm','ml','ui','ux','api','sql','ceo','cto','cfo','vc','prd','mvp','roi','saas','b2b','b2c','seo','sre','pm','vp','yc','irctc','ipl','cdn','hls','dash','bgp','ecmp','kv','pe','cro','ugc','pmf','gtm','kpi','tco']);
const SMALL=new Set(['a','an','and','as','at','but','by','for','in','of','on','or','the','to','vs','via','with','over','from']);
function tc(str){const w=(str||'').split(' ').filter(Boolean);
  return w.map((x,i)=>{const l=x.toLowerCase();
    if(ACR.has(l))return l.toUpperCase();
    if(i>0&&i<w.length-1&&SMALL.has(l))return l;
    return l.charAt(0).toUpperCase()+l.slice(1);}).join(' ');}
function monthKey(d){return d.slice(0,7);}
function monthLabel(k){const [y,m]=k.split('-');return MONTHS[+m-1]+' '+y;}
function idOf(d){return d.date+'|'+d.source+'|'+d.theme;}
function catClass(c){return CAT_CLASS[c]||'c-gen';}

function groupVal(d){return groupBy==='category'?d.category : groupBy==='source'?d.source : monthKey(d.date);}
function groupLabel(v){return groupBy==='month'?monthLabel(v) : groupBy==='source'?tc(v) : v;}
function groupSort(keys){
  if(groupBy==='category') return CAT_ORDER.filter(c=>keys.includes(c)).concat(keys.filter(k=>!CAT_ORDER.includes(k)));
  if(groupBy==='month') return keys.sort().reverse();
  return keys.sort();
}

function buildChips(){
  chipsEl.innerHTML='';
  let vals;
  if(groupBy==='category') vals=CAT_ORDER.filter(c=>DIGESTS.some(d=>d.category===c));
  else if(groupBy==='source') vals=[...new Set(DIGESTS.map(d=>d.source))].sort();
  else vals=[...new Set(DIGESTS.map(d=>monthKey(d.date)))].sort().reverse();
  vals.forEach(v=>{
    const b=document.createElement('button');
    const cls=groupBy==='category'?catClass(v):'c-src';
    b.className='chip'+(filter===v?' on '+cls:'');
    const dotColor=groupBy==='category'?`var(--${catClass(v).replace('c-','cat-')})`:'var(--accent)';
    b.innerHTML=(filter===v?'':`<span class="dot" style="background:${dotColor}"></span>`)+(groupBy==='month'?monthLabel(v):tc(v));
    b.onclick=()=>{filter=(filter===v?null:v);buildChips();buildList();};
    chipsEl.appendChild(b);
  });
}

function visible(){
  const f=(qEl.value||'').toLowerCase();
  return DIGESTS.filter(d=>{
    if(filter!=null && groupVal(d)!==filter) return false;
    if(f){const hay=(d.theme+' '+d.show+' '+d.source+' '+d.category+' '+d.md).toLowerCase(); if(!hay.includes(f)) return false;}
    return true;
  });
}

function buildList(){
  const vis=visible();
  listEl.innerHTML='';
  nEl.textContent=vis.length+(vis.length===1?' reading':' readings');
  if(!vis.length){listEl.innerHTML='<div class="empty-list">No readings match.</div>';return;}
  const groups={};
  vis.forEach(d=>{const k=groupVal(d);(groups[k]=groups[k]||[]).push(d);});
  groupSort(Object.keys(groups)).forEach(k=>{
    const hd=document.createElement('div'); hd.className='group';
    hd.innerHTML=`<span class="gname">${groupLabel(k)}</span><span class="gbar"></span><span class="gn">${groups[k].length}</span>`;
    listEl.appendChild(hd);
    groups[k].forEach(d=>{
      const b=document.createElement('button');
      b.className='item'+(idOf(d)===activeId?' active':'');
      const tag=`<span class="tag ${catClass(d.category)}">${d.category}</span>`;
      b.innerHTML=`<div class="theme">${tc(d.theme)}</div><div class="meta">${tag}<span>${tc(d.show)}</span></div>`;
      b.onclick=()=>render(d);
      listEl.appendChild(b);
    });
  });
}

function render(d){
  activeId=idOf(d);
  const crumbs=`<div class="crumbs"><span class="tag ${catClass(d.category)}">${d.category}</span><span>${tc(d.source)}</span><span>·</span><span>${tc(d.show)}</span><span>·</span><span>${d.date}</span></div>`;
  docEl.innerHTML=crumbs+marked.parse(d.md);
  document.querySelector('.main').scrollTop=0;
  buildList();
}

groupSeg.querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{groupSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');groupBy=b.dataset.g;filter=null;buildChips();buildList();};
});
qEl.addEventListener('input',buildList);

// theme toggle (persisted best-effort)
const themeBtn=document.getElementById('themeBtn');
try{const t=localStorage.getItem('readings-theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
themeBtn.onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':(cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark'));
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('readings-theme',next);}catch(e){}};

buildChips();
buildList();
if(DIGESTS.length){render(DIGESTS[0]);}
else{docEl.className='emptyMain';docEl.textContent='No readings yet.';}
</script>
</body>
</html>
