    "md": "# Learning Digest — 2026-06-30\n\n_Episode: Topline — \"Godfather of Modern GTM: How To Measure AI Impact\" (Mark Roberge, Stage 2 Capital)_ · _Read time: ~9 min_\n\n## Topline — Mark Roberge on measuring AI's impact on sales\n\n**Theme:** Decompose sales productivity into its constituent variables so you can measure where AI actually moves the needle — and a structural argument for why fast followers have an unusually wide window right now.\n\n### Revenue velocity is a control-locus decomposition, not a calculator\n\n**Said.** The formula is `(# opportunities × ACV × close rate) / sales cycle = revenue per rep per period`. Roberge runs it *backwards*: start from the output you want (% of reps at quota), then ask which variable is easiest to change. His answer: number of opportunities, because it's \"100% in our control\" — the others aren't.\n\n**First principles.** The formula's value is diagnostic, not arithmetic. Its real move is exposing that each variable is governed by a *different actor*. ACV is constrained by market positioning (raising it migrates you upmarket). Close rate and sales cycle are governed by buyer behaviour. Number of opportunities is the only variable endogenous to the selling organisation. Any multi-variable system whose inputs have different ownership structures should be factored this way: separate *who controls what* before deciding where to invest. Optimising the loudest variable (close rate *sounds* exciting) instead of the most controllable one is a category error dressed up as ambition. Endogenous wins compound; exogenous wins need other actors to cooperate.\n\n**Practically.** To assess any claimed productivity gain across a workflow: list every variable in the output formula, annotate each by who governs it, and concentrate investment in the endogenous ones.\n\n### Selling time — AI compresses overhead, it doesn't amplify the core\n\n**Said.** \"Best-in-class has historically been about 30%, and today's AI can push that to 60%+.\" Selling time = the fraction of a rep's week in live prospect/customer conversation. Going 30%→60%, all else equal, algebraically doubles output.\n\n**First principles.** Most knowledge-work constraints live in the *overhead wrapping* the value-creating activity, not in the activity itself. A surgeon's constraint is OR time, a lawyer's is billable hours, a salesperson's is prospect-facing conversation — and the utilisation rate of that core activity is strikingly low, because each instance generates a large administrative tail (prep, notes, follow-up, CRM, scheduling). AI compresses the tail without touching the core. The \"doubling\" isn't magic; it works precisely *because* the baseline sits so far below the theoretical ceiling. Reframed: going 30%→60% isn't an improvement, it's the removal of an unnecessary floor.\n\n**Practically.** For any role, ask what fraction of time currently reaches the core value-creating activity. If overhead is large (>50%), even modest overhead reduction yields big output leverage. If overhead is already small, AI's gains will show up elsewhere — don't expect them here.\n\n### Buyer-side inertia is the hard ceiling on AI sales acceleration\n\n**Said.** \"Vendors are highly motivated to accelerate sales actions with AI. The buyers are not feeling that same pressure.\" AI compresses seller-side steps, but the buying committee — RFPs, consensus-building, procurement, legal — runs on the buyer's clock.\n\n**First principles.** In any two-sided sequential process, throughput is bounded by the slowest side. This is Amdahl's Law applied to a two-party pipeline: optimising the fast side of a process bounded by a slow side yields diminishing returns on *total* throughput. Seller-side AI gains accumulate only in steps the seller owns; enterprise cycles are dominated by buyer-owned steps, so seller compression barely moves close rate or cycle time. That's exactly why Roberge excludes those two variables from his AI thesis — the bottleneck isn't on his side of the pipe.\n\n**Practically.** When measuring AI ROI in any two-party workflow, decompose the full timeline into steps by ownership and set targets only on the steps you own. If the bottleneck sits with the counterparty, report seller-side efficiency *separately* from end-to-end outcomes — conflating them hides where improvement actually happens.\n\n### ACV jail and the structural case for fast-following\n\n**Said.** Fast followers win roughly two-thirds of the time, and three forces have widened the window now: AI made product-copying ~10× faster; first movers sit at unprecedented valuation multiples that trap them in \"ACV jail\"; and the earliest AI-native products were built on already-outdated architectures.\n\n**First principles.** *ACV jail* is the mechanism. A company that raised at, say, 100× ARR must maximise revenue to grow into its valuation — which means maximising ACV. Dropping ACV 70% to fight a price-cutting entrant would collapse the revenue base and break growth expectations, even when it's strategically correct. This is structural, not cowardice. The fast follower also skips the first mover's two biggest hidden costs: educating the market (already paid, category now accepts the idea) and figuring out what to build (the incumbent's product is a de-facto spec). The counterweight is the *trust moat*: in markets where procurement runs on institutional legitimacy rather than price-performance (law, regulated industries), brand becomes a real barrier. Harvey in legal is the example — a marquee firm adopting it is a trust signal the category defers to, regardless of a cheaper competitor's feature parity.\n\n**Practically.** To judge whether a first mover is vulnerable, check three conditions: (1) does the valuation multiple create pricing rigidity; (2) is there a genuine data/network moat or is it just a software surface; (3) does the buyer care about trust/brand or price-performance? High multiple + no structural moat + price-sensitive buyer = the zone where fast-following is most lethal to the incumbent.\n\n### PMF and GTM fit are sequential tests, not simultaneous targets\n\n**Said.** PMF = can you create the promised value (measured by retention, with *no* regard to unit economics). GTM fit = can you acquire and serve those customers *profitably*. Roberge chases PMF \"in an unscalable manner\" before introducing economics.\n\n**First principles.** These are independent axes. You can have high retention (real PMF) with terrible economics (no GTM fit), or efficient acquisition (looks GTM-fit) with poor retention (no actual PMF). Conflating them corrupts the diagnostic. The reason to *sequence* them: PMF search needs maximum experimental surface — motions and use-cases you'd never try if unit economics were binding. Impose economics too early and you shrink the search to configurations that are already efficient, biasing toward local optima. And GTM fit only means something once retention is repeatable — otherwise you're optimising a leaky bucket.\n\n**Practically.** Run both tests independently. \"Do customers who use this stay?\" is the PMF test; \"can we acquire them at a sane cost?\" is the GTM-fit test. A company with the second but not the first is building an efficient acquisition machine for customers who leave — invisible at the top line until cohorts mature. Don't impose GTM-fit metrics until PMF is confirmed.\n\n### Cohort rotation — high-frequency measurement without survey fatigue\n\n**Said.** At HubSpot, with thousands of customers, they split the base into six representative cohorts and surveyed one per month. Each customer was contacted twice a year, yet the company got a fresh company-level NPS every month with updated promoter/detractor diagnostics.\n\n**First principles.** This resolves a structural tension: high *measurement* frequency (monthly signal for iteration) conflicts with high *contact* frequency (fatigue, falling response quality). Rotating cohorts decouples the two — but only if each cohort is genuinely representative, otherwise you're trending different populations rather than the same one. It's stratified sampling over time: full population as the unit of analysis, rotating subgroups as the sample. Applies anywhere individual contact frequency binds how often you can measure — employee engagement, UX feedback, health checks, longitudinal studies.\n\n**Practically.** In any repeated-feedback mechanism, separate \"signal frequency\" (how often the org learns) from \"contact frequency\" (how often any individual is asked); decouple them via rotation. The binding constraint becomes minimum subgroup size for statistical reliability, not budget or survey length.\n\n## New concepts (learned today)\n- **Revenue Velocity Formula** — `(# opps × ACV × close rate) / sales cycle`; its value is diagnostic — exposing which variable is controlled by whom — not computing a number.\n- **ACV Jail** — a structural trap where a high valuation multiple forces you to maximise contract value, making it impossible to drop price against a cheaper entrant without collapsing the revenue base.\n- **Selling Time** — % of a rep's week in live prospect/customer conversation; best-in-class historically ~30%; the variable AI most directly expands by compressing admin overhead.\n- **GTM Fit** — the stage *after* PMF: proof that customers who get the promised value can be acquired and served profitably; deliberately decoupled from PMF so premature unit-economics optimisation doesn't shrink the experimental surface.\n\n## Connections\n- PMF-vs-GTM-fit sharpens the standard NRR / CAC / LTV frame: NRR is specifically the *PMF* test and LTV/CAC is the *GTM-fit* test — they're not interchangeable proxies for \"traction,\" and applying GTM-fit metrics before PMF is confirmed manufactures false confidence.\n\n## Left out\nThe trivia quiz (Palantir rule-of-40, Twilio ARR/employee), HubSpot stock + founder-return speculation, and the book-writing banter — opinion and name-dropping with no transferable mechanism."

    "md": "# Learning Digest — 2026-06-30\n\n_Episode: The Neon Show — \"How 3 Friends From Coimbatore Run Olympics and Super Bowl | The Untold Amagi Story\"_ · _Read time: ~10 min_\n\n## The Neon Show — the Amagi story\n\n**Theme:** How to build durable infrastructure businesses by betting on structural position over current revenue — told through two pivots, a 30-year framing, and an Emmy.\n\n### The structural-deficiency test — pivot a *growing* business, not a dying one\n\n**Said.** They shut down a ₹180-crore, revenue-doubling business. \"If you're going to run it for the next thirty years, this is not a structurally solid business design.\" Their geo-targeting revenue cannibalised TV networks' own national ad sales, so those same networks throttled Amagi's pricing, distribution, and who it could sell to.\n\n**First principles.** Revenue trajectory and structural position are independent variables, and confusing them is one of the costliest mistakes in company-building. A business can grow while its leverage rots — customer concentration, dependence on a counterparty's goodwill for your cost structure, and a model whose very success harms the buyer. For Amagi, scale made the networks *more* hostile: growth eroded structural position instead of improving it. The right question when deciding whether to continue a line of business isn't \"are the metrics up?\" but \"does growth compound our negotiating power, switching costs and TAM ceiling — or erode them?\" Structural rot is invisible on a P&L until it collapses.\n\n**Practically.** Before concluding a business \"works\" because numbers are up, explicitly map what happens to structural factors (customer concentration, channel conflict, pricing control) as it scales 3× and 10×. If scale worsens them, the business is in trouble regardless of trajectory.\n\n### Irrational early adopters are the only door into risk-averse enterprise markets\n\n**Said.** \"These are people who felt the passion... they're delivering at speeds I've not seen. It's worth a bet. I know it's irrational in my heart, but let me take it.\" NBC handed them fringe projects first, watched the POC, then escalated to mission-critical workloads.\n\n**First principles.** Enterprises in high-consequence industries (broadcast, banking, aviation) build procurement processes engineered to exclude unproven vendors — RFPs, financial audits, multi-vendor bake-offs. Rational at the system level, but structurally biased toward incumbents. The only exploitable gap is the individual who *bypasses* the system: Geoffrey Moore's \"visionary,\" betting on potential and personal conviction over formal scoring. The trust ladder then runs: win a fringe project, prove delivery speed and accountability, use internal visibility to expand scope — until you're running their Super Bowl and procurement is now biased toward *keeping* you. The key counter-intuitive point: trying to look more \"rational\" (better financials, more compliance) to win early enterprise deals is the wrong move — it just makes you a worse copy of the incumbent. The only asymmetric edge is founder presence + delivery velocity that an irrational champion can point to.\n\n**Practically.** For a new entrant in a conservative vertical, the GTM question isn't \"how do we look credible to procurement?\" but \"who is the irrational champion inside this org, and what's the smallest project that gives *them* a visible win?\" Formality and RFP-compliance help only *after* a champion has created internal pull.\n\n### Vulnerability is the trust signal in mission-critical sales\n\n**Said.** A customer asked how many times they'd gone black on air. \"If you had told me never, I would not have signed the deal. We'd believe you'd never done real broadcasting.\"\n\n**First principles.** In high-stakes systems the buyer's mental model isn't \"will this fail?\" but \"how will this vendor behave when it inevitably does?\" A claim of zero failures is diagnostic — it means either (a) you've never operated at real stress conditions and can't be trusted with mission-critical load, or (b) your culture will deflect blame when failures come. Both disqualify. Admitting documented failures *and* demonstrating recovery competence signals two things at once: genuine operational experience and an accountable culture. This inverts commodity software, where SLA claims are table stakes and uptime is independently verifiable. In genuinely complex infrastructure, claimed perfection destroys trust; documented failure-and-recovery builds it — because the buyer has already internalised that failures happen and is really evaluating your *failure-response loop*.\n\n**Practically.** \"What was your worst incident and what did you change?\" is an opportunity, not a threat. Answering with specificity and demonstrated follow-through signals something no uptime guarantee can: that you'll own the problem rather than litigate the SLA.\n\n### Focus is a signal generator, not just a resource conserver\n\n**Said.** After the pivot: \"We'll do only one country, one product, one cohort of customers. One language, one time zone, one set of standards.\" They held this even after raising $100M+.\n\n**First principles.** Focus is usually framed as resource management — don't spread thin. The deeper mechanism is *signal quality*. When every customer interaction shares the same geography, product and cohort, feedback is dense and context-consistent: you can separate product signal from customer idiosyncrasy and build pattern recognition that compounds across the team. A multi-geo, multi-product strategy mixes contexts — a win might be product-market fit, a lucky customer, or a geography effect, and you can't disentangle which. There's also an alignment mechanism: when all engineers, sellers and CS reps solve variants of the *same* problem for the *same* buyer, learning accumulates in one place instead of siloing. Amagi's 24-hour loop (India builds overnight, Srini demos in LA at 9am) was only possible because the scope was narrow enough for an overnight cycle to produce demo-worthy output.\n\n**Practically.** \"How many things are we pursuing?\" matters less than \"do all of them share the same customer context?\" Coherent focus — same buyer, adjacent problems — yields tighter feedback loops and compounding organisational learning. Breadth across customer types or geographies creates noise that hides what's actually working, even when metrics look fine.\n\n### Late-adopter industries create the deepest first-mover switching costs\n\n**Said.** \"60%+ of all US TV channels run on Amagi infrastructure.\" Customers who once gave only fringe projects now call to ask if Amagi is financially healthy — \"because you are the backbone now.\"\n\n**First principles.** In industries where failure has asymmetric consequences (broadcast, air-traffic control, market infrastructure), buyers delay adoption longer than strictly rational — they wait for proof at high stakes before committing. So when the industry finally crosses over, the vendor who earned trust during the visionary phase is already *embedded* exactly when the rational majority starts looking. The switching costs here aren't mainly contractual — they're operational: the vendor knows your systems' edge cases, your team is trained on its tooling, your disaster-recovery plans name it explicitly, your customer SLAs derive from its uptime. Replacing it isn't a procurement decision, it's a multi-year re-engineering project. And the late-majority buyer now evaluates you on industry consensus (\"60% already use it\") rather than merit, a self-reinforcing default. Net: late adoption in risk-averse industries produces *stickier* first-mover advantage than consumer markets, precisely because the trust bar was higher to clear.\n\n**Practically.** In any infrastructure market with risk-averse buyers, ask \"whose trust, if earned, makes us the structural default when the late majority arrives?\" Not all early customers are equal — the ones who let you touch mission-critical workloads become references that compress the irrationality required of every later buyer.\n\n### The technology moat is dead; business moats are what compound\n\n**Said.** \"There's nothing called a technology moat — that's gone for everybody. When software becomes close to zero, moats are going to be business moats.\" Cites Hamilton Helmer's *Seven Powers* as the enduring lens.\n\n**First principles.** A technology moat is a proprietary capability others can't replicate (algorithms, patents, trade secrets). With open-source models, commoditised cloud, and AI-accelerated development, the cost to replicate any specific technical capability approaches zero over a multi-year horizon. So technology is the *entry ticket* to a market, not the source of persistent value. Business moats — Helmer's seven — are structural positions that make a competitor's entry *unprofitable even with equivalent technology*: scale economies, network effects, switching costs, counter-positioning, branding, cornered resource, process power. The load-bearing assumption is that software costs keep falling fast enough that any technical differentiation erodes within a market cycle — which the AI era makes more plausible. If true, \"what's your tech advantage?\" is a weaker diligence question than \"what makes it structurally unprofitable for a better-funded clone to displace you?\" The first is answerable with a slide; the second needs a real answer.\n\n**Practically.** To judge any software business's durability, identify which of Helmer's structural positions it occupies. If the answer is \"none — the value is the technology,\" that's a valuation window, not a moat. \"What happens if a well-funded competitor builds equivalent tech in 18 months?\" should have a *structural*, not technical, answer.\n\n### Time-vs-money is the structural determinant of SaaS pricing power\n\n**Said.** \"In India we value money more than time. In the US, time is more valuable than money... paying for something over its value is something US customers still see.\"\n\n**First principles.** Willingness-to-pay for SaaS is set by which resource is the buyer's *binding constraint*. When time is scarce (high labour costs, fast competition, high opportunity cost of slowness), buyers pay for speed and reliability without demanding exhaustive TCO analysis — time saved is unambiguous. When money is scarce (cost-center mindset, lower labour costs, thin margins), SaaS becomes a cost line requiring detailed ROI justification, with cheaper/slower alternatives as the default. This isn't purely cultural, it's economic — and it also drives sales-cycle length: when time is the constraint, urgency to stop wasting it outruns caution about price, so deals close faster. Corollary: a product that sells on time-savings at US enterprise pricing may need *repositioning* (not just discounting) where money is the binding constraint, because the value-proposition *category* is different, not just the price point.\n\n**Practically.** Before entering a new market or segment, map the buyer's binding constraint. If time isn't valued (procurement wants five quotes and a six-month approval), a speed/convenience positioning has a structural pricing problem no discount fixes — it likely needs repositioning around cost savings, which is a different proposition with different features, case studies and buyer education.\n\n## New concepts (learned today)\n- **Crossing the Chasm (Geoffrey Moore)** — adoption bell curve (innovators → early adopters/visionaries → early majority/pragmatists → late majority → laggards). The core claim: a structural \"chasm\" sits between visionaries and pragmatists because they buy differently — visionaries on potential and passion, pragmatists on proven references. Market entry must treat them as separate campaigns; winning one doesn't win the other.\n- **Seven Powers (Hamilton Helmer)** — seven durable advantages that persist against well-funded competition: scale economies, network effects, counter-positioning, switching costs, branding, cornered resource, process power. A lens for \"structural moat vs. mere tech lead.\"\n- **FAST channels (Free Ad-Supported Streaming TV)** — linear (scheduled) streaming, free to viewers, monetised entirely by ads, delivered over IP rather than cable/satellite. Distinct from SVOD (subscription). Emerged in the US ~2016–17; Amagi became the backbone for much of the US FAST ecosystem.\n\n## Connections\n- \"Technology moat is dead\" is a direct counterpoint to any AI-era thesis that proprietary model weights or fine-tuning are a durable moat — worth tracking against future episodes on AI defensibility.\n- The \"irrational early adopter\" mechanism is structurally the *same* as Crossing the Chasm's visionary-phase strategy — two shows describing one pattern from different angles.\n\n## Left out\nThe palmist origin anecdote, homeschooling/family logistics, rapid-fire book admiration beyond what was analysed, and the closing India-optimism riff — colour without a transferable mechanism."

    "md": "# Learning Digest — 2026-06-30\n\n_Episode: Langfuse — \"Langfuse Intro: Evaluations Deep Dive\"_ · _Read time: ~6 min_\n\n## Langfuse — Evaluations Deep Dive\n\n**Theme:** How to architect a closed feedback loop where production LLM behavior continuously populates the test dataset that governs the next development iteration. Where yesterday's Braintrust episode named the principle (eval-as-PRD, the David loop), this one shows the plumbing — where new test cases come from, how human attention gets rationed, and what makes an offline comparison actually valid.\n\n### Production is the discoverer of test cases, not just the place you debug\n\n**Said.** \"The main goal is to identify new test cases that you forgot to track within your datasets.\" Production monitoring feeds *back into the offline dataset* — it's not only a debugging surface.\n\n**First principles.** In traditional software the input space is bounded: finite code paths, known APIs. You can enumerate failure modes upfront and write tests *before* shipping. LLM applications invert this, because the input is open-ended natural language — the full distribution of user intent is unknowable in advance. That structural fact reverses the testing direction. Instead of *design tests → ship → monitor*, the correct flow is *ship → let production sample the true distribution → harvest the edge cases it reveals → backfill them into the offline suite*. Your offline dataset is therefore never a complete spec; it is a continuously growing approximation of what production will throw at the system, and its quality ceiling is set by how diverse a slice of production you've captured and classified. The test set chases the input distribution forever; it never closes.\n\n**Practically.** Treat the production trace store as a living discovery engine, not a log you grep when something breaks. The real high-judgment work is *deciding which traces to promote* into the dataset — that decision encodes a theory of which failure modes matter. A team that ships and never harvests is throwing away its only source of ground truth about its own input distribution.\n\n### Score provenance, not score value, determines what a signal is worth\n\n**Said.** Four distinct score sources: user feedback from the UI (an explicit thumbs-down), LLM-as-judge (automated, running inside the platform), human annotation via queues (a manual labeler), and custom scores ingested over API/SDK from any external system.\n\n**First principles.** These four differ on three independent axes. **Cost:** human annotation ≫ LLM-judge ≫ passive user signal ≫ fully automated. **Latency:** user feedback is real-time, human annotation is scheduled, CI evals are batch. **Ground-truth distance:** human judgment *is* the reference; user feedback is noisy but measures actual utility; the LLM-judge introduces model bias that is *correlated with the production model itself* — the most dangerous kind, because the judge can be blind in exactly the places the system is. A stack that treats all four as interchangeable is confusing throughput with reliability. The right structure is a portfolio: cheap automated signals triage at scale, expensive human signals anchor calibration where the error category actually matters. This is the same architecture as any serious measurement system — continuous cheap sensors plus periodic ground-truth audits. The audit never replaces the sensor; it tells you how much to trust it.\n\n**Practically.** Design the eval stack as a funnel, not a flat list of metrics. Run the LLM-judge on sampled traffic to estimate the *proportions* of each failure category; use that distribution to decide where to spend scarce human-labeling budget; use the human labels to check whether the judge is systematically biased on that category. The judge's job is to point; the human's job is to calibrate the pointer.\n\n### The annotation queue is a work-routing primitive — its filter is the whole point\n\n**Said.** Filter traces by criteria (e.g. \"user feedback = 0 in the last 7 days\"), batch-select, push to a named queue with a defined eval schema, route to labelers. \"Thread-safe, can scale to hundreds of annotators.\"\n\n**First principles.** Human labeling attention is a constrained, high-unit-cost resource. With no routing layer, labelers face the full undifferentiated production stream — most of which carries no signal, because the model handled it fine. An annotation queue is really a *priority queue where the filter logic is the intellectual work*: it encodes a theory of which regions of the input-output space are informative. The queue also decouples **capture** (async, continuous, production time) from **review** (batched, human time), which both prevents two labelers re-labeling the same trace and stops the human from being flooded by real-time volume. It's structurally identical to incident triage in on-call: the alert-routing rules are where the domain knowledge lives, and the queue enforces orderly processing under load.\n\n**Practically.** The value of an annotation queue is almost entirely in its filter criteria. A queue that fires on every trace is useless; one that fires on \"user explicitly complained AND automated score below threshold\" isolates the failure signal and makes the human's time count. If you find yourself tuning the labeling UI before the filter, you're optimizing the wrong layer.\n\n### A dataset run is only valid if the dataset is the held-constant axis\n\n**Said.** A dataset run is a named, versioned execution of a prompt or model config against a fixed dataset; multiple runs show up as columns in a side-by-side grid, letting you compare any two changes on identical inputs.\n\n**First principles.** This puts a concrete mechanism under eval-as-PRD. To measure whether a change *helped*, you need two things: the stimulus held constant (same inputs) and the treatment varied (different prompt, model, or retrieval). The versioned dataset run operationalizes this by making the dataset the fixed axis and the experiment the varying one. Why this matters: relative comparison (\"did this change improve quality on this input set?\") is always more tractable than absolute assessment (\"is this output good?\"), because it collapses a hard open-ended judgment into a differential. It is an offline A/B test — and just as an online A/B test is only meaningful because the traffic split holds the population constant, a dataset run is only meaningful because the input set is frozen.\n\n**Practically.** Hold the dataset stable while the prompt/model changes. If you extend the dataset *and* change the prompt in the same step, you've destroyed the controlled comparison — you can no longer tell \"the prompt improved\" from \"the new inputs happened to be easier.\" Grow the dataset and evaluate changes as two separate, non-overlapping operations.\n\n## New concepts (learned today)\n- **Trace (LLM observability)** — a structured, hierarchical log of every LLM call, tool invocation, retrieval step, and intermediate state within a single application request; the atomic unit of inspection for debugging and evaluation. It preserves the full causal chain from user input to final response, so you can reconstruct *where* and *why* the system deviated after the fact.\n- **Dataset Run (Experiment)** — a named, versioned execution of a prompt/model/config against a fixed, stable eval dataset, producing one comparable row in a side-by-side table. The fixed dataset is the controlled variable; the run config is the treatment. Triggerable from CI, a notebook, or the UI.\n\n## Connections\n- **This episode is the upstream half of yesterday's David loop.** The David loop (Braintrust/How I AI, 2026-06-29) specified *when* to invoke human review and *how* to gate it behind a passing threshold. This episode supplies what was missing: *where new test material comes from* — production is the discovery oracle (Idea 1), and the annotation-queue filter (Idea 3) is the literal implementation of the loop's \"gate expert review behind a threshold.\"\n- **The dataset run concretizes eval-as-PRD.** Eval-as-PRD named the principle — a dataset of (input, expected) pairs as the spec. This episode shows the artifact: a versioned, comparable run object, and makes explicit *why* the dataset must be frozen for any comparison to mean anything. Principle → mechanism.\n- **Tension worth noting:** the LLM-judge bias point (Idea 2) is a quiet warning about leaning too hard on the automated scoring that eval-as-PRD makes so cheap. The judge correlates with the production model, so a fully automated loop can be confidently blind. The human-annotation portfolio is the structural answer — the two episodes agree, but only this one names the failure mode.\n\n## Left out\nSDK syntax, score-schema configuration, data-region routing, and the UI walkthrough — Langfuse-specific implementation detail with no transferable mechanism underneath."

    "md": "# Learning Digest — 2026-06-30\n\n_Episodes: Claude (Anthropic) — \"Evals for taste: Hill-climbing a slide-generation agent\"_ · _Read time: ~9 min_\n\n## Claude (Anthropic) — Evals for taste: Hill-climbing a slide-generation agent\n\n**Theme:** How to build, calibrate, and iteratively act on evaluation systems for agentic AI — when the quality you're chasing is *taste*, not correctness — using a slide-generation agent as the working vehicle.\n\n### The grader taxonomy is a choice about epistemology, not tooling\n\n**What it is.** Three grader types, each with its own cost/nuance tradeoff: code-based (string match, regex, count), model-based (rubric scoring, pairwise comparison, multi-judge consensus), and human review.\n\n**Why it works.** The taxonomy maps onto a deeper question: *what kind of property are you measuring?* \"Did a file get created?\" is a binary fact a code grader answers deterministically. \"Is this slide readable?\" is a judgment call that itself needs semantic understanding — a model grader. \"Is this document trustworthy?\" needs domain expertise that exceeds any rubric — a human. The brittleness of a code grader isn't a flaw; it's the correct behaviour for a deterministic question. The stochasticity of a model grader isn't noise; quality is genuinely a distribution, not a point. Picking a grader is picking the epistemology of the question you're asking.\n\n**Mental model.** Before writing any grader, ask which kind of question it actually answers. If you find yourself fighting a code grader to capture nuance, you've chosen the wrong type. When you can't define \"good\" in the absolute but can reliably recognise it in contrast, reach for pairwise comparison — ask a judge to prefer A or B and explain why.\n\n### Eval-driven hill-climbing: evals are the gradient\n\n**What it is.** The loop: run the agent, inspect grader outputs to find failure modes, change one lever (system prompt, model, or tools), re-run, compare. \"Finding what works, finding what doesn't, iterating, and making sure that the changes you make have actually positive influence on your final outputs.\"\n\n**Why it works.** This is gradient descent on a qualitative objective, with evals as the proxy gradient. Without evals, the feedback signal is \"it feels worse\" — a scalar with no direction. With evals it becomes a *vector*: \"emoji count 20, small-font slides 4, text-heavy slides high\" — specific variables pointing at specific changes. The decisive property of a good eval set isn't coverage; it's that every grader is individually **actionable** — for each failing metric there must be a corresponding lever in the system. A grader that produces no direction you can act on should be deleted.\n\n**Mental model.** Read each eval run as a *diff* against the last one, not as an absolute score. Per grader, ask only: did this move in the expected direction after my change? A fix for X that silently degrades Y gets caught here, before users see it.\n\n### A grader is a component that needs its own QA\n\n**What it is.** Judges scoring 3.8–4.4 on clearly poor slides, and 5/5 on \"image quality\" for a deck with no images. The lesson: \"evals over time, they can evolve. They need to be a living artifact.\"\n\n**Why it works.** An LLM judge is doing inference, and inference needs a prior. Without anchor examples — \"here is a 0, here is a 5\" — the judge falls back on its training-time prior about what those words mean *in general*, which can be wildly miscalibrated for your specific domain. **Saturation** is the tell: when every run lands at 4.2–4.5, the metric has lost resolution. Maybe the system genuinely improved past the scale's sensitivity; maybe the scale was wrong from the start. Either way the grader, not the system, is what now needs work.\n\n**Mental model.** When a human review contradicts a grader (\"I'm arguing this is *not* text-heavy, but my grader says it is\"), that's a bug in the rubric — not evidence the human is wrong. Treat it as the trigger to update the eval, not to override the judgment. The grader is part of the system under test.\n\n### Autoregressive anchoring: put the score last\n\n**What it is.** \"If it is anchored on like this four, it will do anything it can to argue why it should be a four… even if it should be a one, it will still say, oh, it is good for these and these reasons.\"\n\n**Why it works.** LLMs generate tokens autoregressively — each token conditions on all prior tokens. If the numeric score is emitted *first*, it becomes part of the context for every subsequent token, and the highest-likelihood continuation is text that justifies that committed score. The model isn't lying; it's doing its job — producing a coherent continuation. Reverse the order: emit all evidence (pros, cons, observations) first, *then* derive the score, and now the score must be coherent with the evidence rather than vice versa. This is chain-of-thought not as an accuracy aid but as a **causal-ordering constraint**.\n\n**Mental model.** In any LLM-judge schema, put the score field last. It's a tiny structural choice with a large effect on whether scores are epistemically grounded or post-hoc rationalisations.\n\n### The adversarial QA loop: tell the critic problems exist\n\n**What it is.** \"Approach QA as a bug hunt, not a confirmation step… there are issues. You need to find them.\" The QA agent is told problems exist and must complete at least one fix-verify cycle before stopping.\n\n**Why it works.** Instruction framing sets the agent's Bayesian prior for its search. \"Check whether there are issues\" leaves \"no issues found\" as a valid termination — and unbiased critics tend to false-negative (miss real defects) more than they false-positive. \"There ARE issues; find them\" forecloses that exit, forcing the agent to commit to finding something, which changes what it attends to. This is adversarial prompting used productively: you deliberately build a biased critic because the critic's finding isn't the final output — it's an intermediate signal fed back to the generator. A false positive costs one wasted iteration; a false negative ships a real defect.\n\n**Mental model.** For any agent producing a complex artifact, the default \"review this for issues\" framing is weaker than \"this has issues; find them.\" Use the calibrated framing when you want an honest probability of defects; use the adversarial framing when the cost of missing a real defect exceeds the cost of an unnecessary revision.\n\n### Model capability is a dial — and it shrinks the prompt\n\n**What it is.** Switching Sonnet → Opus on the *base* prompt produced slides immediately better than Sonnet with an extensively engineered prompt. \"With these models getting smarter and better over time, you kind of expect them to be able to figure that out on their own.\"\n\n**Why it works.** A more capable model has internalised more implicit conventions from training — what professional decks look like, that emojis are out of place, that fonts must be readable. Explicit system-prompt instructions are *compensating for the gap* between the model's priors and the task's conventions. As capability grows, that gap shrinks and the marginal return to prompt engineering falls. But the same capability that closes the gap also **saturates a poorly-calibrated grader faster** — producing scores that look good while measuring the wrong thing (Opus scoring 5/5 on images that don't exist). So a model upgrade forces an eval recalibration.\n\n**Mental model.** Before upgrading models, run the suite on both with equivalent prompts. If the stronger model matches scores on a *simpler* prompt, prefer the simpler config — it's more robust to future model changes and cheaper to maintain. And watch where the stronger model's priors are still wrong; that's where explicit instruction still earns its keep.\n\n## New concepts (learned today)\n- **Autoregressive anchoring (LLM judge)** — when a judge outputs its score before its reasoning, every subsequent token is conditioned on that committed score and rationalises it instead of deriving it. Fix: emit all evidence first, score last, so causality runs evidence → score.\n- **Adversarial QA loop** — a second critic agent told to *assume* problems exist and hunt for them (not merely check), feeding findings back to the generator. Forecloses the \"no issues found\" exit, raising recall of real defects at the cost of the occasional unnecessary revision.\n- **Eval saturation** — a grader stops yielding signal once the system consistently scores near the scale's ceiling. May mean genuine improvement past the metric's sensitivity, or a scale miscalibrated from the start; either way the rubric/anchors need updating.\n- **Pairwise LLM comparison** — rather than scoring one output on an absolute scale, give the judge two outputs and ask which is better and why. Useful when absolute quality is hard to define but relative preference is easy to elicit reliably.\n\n## Connections\n- **The hill-climbing loop is `Eval-as-PRD` in motion.** The ledger's Eval-as-PRD says specs *are* a scored dataset and a free regression suite; this episode shows what *using* that suite across iterations actually looks like — each run a diff, each grader a lever.\n- **Arguing with your own grader is the `David loop`.** When the speaker insists a slide is \"not text-heavy\" against his grader's verdict, that's exactly the moment the ledger's domain-expert vibe-check cadence prescribes: encode the human correction as an *updated grader criterion*, not a one-off override.\n- **Autoregressive anchoring sharpens `LLM-as-judge`.** The ledger entry treats the judge as a rubric applier; this episode adds a structural failure mode — the rubric alone doesn't guarantee correct scoring, the *output ordering* decides whether reasoning drives the score or the score drives the reasoning.\n\n## Left out\n- A survey of standard benchmark cards (SWE-bench, TauBench, ARC-AGI-2) — name-dropping with no transferable mechanism beyond \"generic benchmarks don't cover your specific use case.\"\n- The live repo/setup walkthrough — procedural, no conceptual depth."

    "theme": "evals and defining the what",
    "md": "# Learning Digest — 2026-06-29\n\n_Episode: How I AI — Ankur Goyal (Braintrust CEO), \"coding agents for hard infra work + demystifying evals\"_ · _Read time: ~9 min_\n\n## How I AI — Ankur Goyal (Braintrust)\n\n**Theme:** When a model can write code competently, the scarce skill shifts from *authoring solutions* to *specifying the target precisely and verifying it rigorously* — which reframes both deep systems work and AI-product development as the single discipline of building feedback loops.\n\n---\n\n### A hard eval is the unit that makes background autonomy safe and productive\n\n**Said.** _\"If you create the right tests and success criteria for a model, then it can be really creative and it can work on this stuff in the background.\"_\n\n**First principles.** Autonomous search is only as good as its objective function. An agent exploring a solution space is running an optimizer — and an optimizer with a sharp, cheap-to-evaluate, hard-to-game objective converges on real improvement, while one with a vague or gameable objective wanders or overfits. What unlocks the \"creativity\" is an **asymmetry of effort**: specifying *what good looks like* is far cheaper than searching over *how to achieve it*, and once the verifier is automated, the search can run arbitrarily long without spending human attention. It's the same structure that makes problems tractable when verification is cheap even though generation is expensive — **value accrues to whoever owns the verifier.** Generalises to any domain where the test can be mechanized (compilers, benchmarks, property tests, simulators): the test, not the solution, is the durable asset.\n\n**Practically.** Before handing open-ended work to an autonomous process, ask: *can I write a cheap, faithful, hard-to-cheat check of success?* If yes, you can let it run far harder and longer than any human would. If no, autonomy produces confident garbage. Build the verifier first, the solver second.\n\n### Practical quality beats theoretical quality, because attention decays and rigor is unbounded\n\n**Said.** _\"There's no staff engineer who is running as many rigorous benchmarks and trying out different algorithms… than someone who's using an agent.\"_\n\n**First principles.** The steelman for \"humans do hard things better\" assumes an idealized human with perfect, inexhaustible attention. That assumption is the load-bearing one, and it's false in practice: human rigor is bounded by sleep, by context-decay across days, and by a steep aversion to tedious-but-necessary work (benchmarking the *slow* path, not just the fast one). The real production failure mode of expert engineering isn't bad reasoning — it's **skipped verification**: you benchmark the two cases reviewers will catch and bluff the rest. An agent drops the marginal cost of the boring check to ~zero, so the binding constraint moves from \"can a human be bothered\" to \"is the check even specified.\" The generalisation: when quality is gated by tedious-but-automatable verification, the right comparison isn't *peak human skill vs. machine skill* — it's *exhaustive cheap rigor vs. selective expensive rigor*, and exhaustive wins on the long tail.\n\n**Practically.** Separate \"theoretical best case\" from \"what actually ships.\" Where quality is lost to skipped checks rather than missing insight, the gain from automation is coverage and consistency, not cleverness. Audit where your *own* rigor quietly stops — the benchmarks you \"didn't get to\" — because that gap is the opportunity.\n\n### Programming as \"defining the *what*\" — the same shift, applied recursively\n\n**Said.** _\"Machine learning… shifts the task of programming from being about the how to being about the what.\"_\n\n**First principles.** ML, evals, and agent-coding are all the *same move*: stop dictating the procedure; specify the objective plus a substrate that searches for the procedure. Linear regression already did it (you supply points and a loss; slope/intercept are *found*, not written). Transformers generalize it (objective = next-token prediction; the \"how\" is whatever the GPUs discover). Evals apply it to product behavior; agentic coding applies it to implementation. The deep point: **\"the what\" is itself a ladder of abstraction levels**, and each new tool lets you climb one rung higher — from writing the algorithm, to specifying success criteria, to specifying the criteria *for the criteria*. It pays off because stating a constraint succinctly is usually exponentially cheaper than satisfying it, so leverage flows to whoever can compress the problem into the tightest faithful objective. A working definition of expertise in this regime: knowing *what* to demand and *how to check it* — not *how* to build it.\n\n**Practically.** On any problem, split the layer where your judgment is irreplaceable (defining and verifying the target) from the layer that can be searched (the implementation). Push your effort *up* the abstraction ladder until you're only spending it on what a search process genuinely can't supply.\n\n### Bloom filters: a \"wrong-on-the-cheap-side\" data structure\n\n**Said.** _\"Bloom filters kind of have a bad reputation, but they worked out to be very effective in this case\"_ — found after a week of continuous index experiments.\n\n**First principles.** A Bloom filter is a small bit-array plus *k* hash functions: to insert, set the *k* bits each hash points to; to test membership, check whether all *k* are set. Its power is a deliberate **one-sided error** — it can say \"definitely not present\" with certainty, but \"possibly present\" only probabilistically (never a false negative, sometimes a false positive). That asymmetry is exactly what the needle-in-billions query needs: cheaply eliminate the vast majority of blocks that *cannot* contain the match, and pay the expensive exact lookup only on the survivors. The mechanism generalises to a whole class of **approximate pre-filters**: trade a bounded, controllable error *in the harmless direction* for an enormous reduction in expensive work. Its \"bad reputation\" comes from judging it on standalone accuracy rather than on its role as a cheap front-line gate before an exact check — context, not the structure, decides whether it's good.\n\n**Practically.** When an exact operation is expensive and most inputs don't qualify, look for a cheap probabilistic pre-filter whose errors fall only on the safe side (false positives you'll re-check, never false negatives you'd miss). Evaluate such components by their *role in the pipeline*, not by isolated accuracy — a \"low-quality\" part can be the right one in the right slot.\n\n### The column-store / execution-engine matrix, and the EC2↔S3 latency wall\n\n**Said.** Exhaustively _\"trying every open source column store format… and every column store execution engine… computing the matrix,\"_ and testing _\"4,000 concurrent reads\"_ of real EC2↔S3 latency.\n\n**First principles.** Two independent things are being separated. (1) **Storage format** (column-store) lays data out by column rather than by row, so an analytical query touching a few attributes over billions of records reads only those columns' contiguous bytes — and homogeneous columns compress far better, slashing I/O, the true bottleneck. (2) **Execution engine** is the orthogonal question of *how* the scan/filter/aggregate runs over that layout (vectorized batches, predicate pushdown, etc.). Because they're independent axes, the right move is a Cartesian sweep — the \"matrix\" — since the best pairing isn't deducible a priori. The deeper constraint is physical: with data in object storage (S3) and compute in EC2, performance is governed not by CPU but by **how many concurrent reads you can issue and overlap against network round-trip latency**. The whole problem becomes latency-hiding: keep enough requests in flight that latency is amortized. Generalises to any disaggregated storage-compute system, where the binding limit moves from local cycles to network parallelism.\n\n**Practically.** For scan-heavy/analytical workloads, treat data layout and execution strategy as separate, independently-tunable axes — and *sweep* the combinations rather than assuming the best one. Wherever storage and compute are physically separated, reason about throughput as **concurrency × per-request latency**: the lever is how many reads you keep in flight and interleave, not raw compute.\n\n### Carving, not constructing — and why a complaint usually means *delete*\n\n**Said.** _\"Product building and code writing now looks like carving rather than constructing… 90% of the time someone complains, we remove the thing.\"_\n\n**First principles.** When the marginal cost of producing features collapses toward zero, the scarce resource flips from *creation* to *subtraction*. Construction assumes each addition is expensive, so you add deliberately; carving assumes material is nearly free, so the work is removing excess to reveal a coherent whole. Why a complaint usually means *delete*: a complaint is evidence that some piece of complexity created confusion, and once you understand the user's actual point of view you can often redesign so the **underlying complexity never needs to exist** — removing the cause beats patching the symptom (their command-F example: a powerful cross-span search *was* the confusion; simplifying it was the fix). This is a law of cheap-generation regimes: as production cost falls, feature-bloat/entropy becomes the *default* failure mode, and editorial judgment — what to remove — becomes the differentiator. CI plays the dual role: it's the verifier that *earns the right to move fast* — the same \"build the check first\" logic applied to shipping.\n\n**Practically.** Wherever output is cheap to generate, assume the default failure is excess, and treat deletion/simplification as primary work, not cleanup. Read a complaint as a signal to *remove* confusing complexity, not to add an explanatory feature. And gate speed behind your verification layer — when you feel slow, the fix is often improving the check (CI/tests), which then lets everything else move faster.\n\n## New concepts (learned today)\n- **Bloom filter** — compact bit-array + *k* hash functions giving probabilistic set membership with one-sided error: \"definitely not in set\" is certain, \"possibly in set\" can be a false positive, never a false negative. Used as a cheap pre-filter to skip expensive exact lookups on data that provably can't match.\n- **Column store (vs row store)** — storage layout grouping values by column instead of by row, so analytical queries read only the needed columns (and compress them well, cutting I/O). Orthogonal to the *execution engine* that scans/filters/aggregates over the layout.\n- **Disaggregated storage-compute (EC2↔S3 pattern)** — architecture where data lives in object storage and compute is separate, so query performance is bound by network concurrency/latency (how many reads you can issue and interleave), not local CPU.\n- **The \"agent line\"** — a mental threshold: any decision where handing the same information to an agent would yield the same result sits *below the line* and should be delegated; the line rises as you build better skills/integrations, freeing attention for what's above it.\n- **Carving vs constructing** — in cheap-generation regimes, building shifts from deliberate addition (each feature costly) to subtraction (removing excess from near-free material); editorial deletion becomes the scarce skill.\n\n## Connections\n- **\"Hard eval makes autonomy safe\"** and **\"CI earns the right to move fast\"** are the *same mechanism* — build the verifier first — applied to AI products vs. software shipping. Both are the engineering twin of the ledger's **Eval-as-PRD**.\n- **\"Programming as defining the *what*\"** is the parent abstraction that **Eval-as-PRD** and **LLM-as-judge** (both in the ledger) are concrete instances of: specify the *what* + a substrate that searches the *how*.\n- The **\"David loop\"** (ledger) recurs with new depth on *why* it scales the expert rather than replacing them: the quantitative evals act as a cheap pre-filter (Bloom-filter-like) so the scarce tastemaker is spent only on the survivors — applying his palette to *more* cases, not fewer.\n\n## Left out\nOnly true filler: the no-meetings-after-noon / maker-vs-manager riff (motivational, no transferable mechanic past \"make focus time\"), the TMUX/Portless/work-tree tooling logistics (un-generalisable tool name-dropping), the laptop-at-dinner anecdote, and sponsor reads. **Kept** the column-store / Bloom-filter / EC2↔S3 systems material in full despite it being \"non-actionable\" — that depth is the point now."
  }
]</script>
<script>
  const DIGESTS = JSON.parse(document.getElementById('digest-data').textContent);
  const listEl   = document.getElementById('list');
  const docEl    = document.getElementById('doc');
  const qEl      = document.getElementById('q');
  const countEl  = document.getElementById('count');
  const showFilterEl = document.getElementById('showFilter');
  const dateFilterEl = document.getElementById('dateFilter');
  let active = -1;
  let activeId = null;

  const ACRONYMS = new Set(['ai','llm','ml','ui','ux','api','sql','ceo','cto','cfo','vc','prd','mvp','roi','saas','b2b','b2c','seo','sre','pm','vp','yc']);
  const SMALL_WORDS = new Set(['a','an','and','as','at','but','by','for','in','of','on','or','the','to','vs','via','with','over','from']);
  function titleCase(str){
    const words = (str||'').split(' ').filter(Boolean);
    return words.map((w,i)=>{
      const lw = w.toLowerCase();
      if(ACRONYMS.has(lw)) return lw.toUpperCase();
      if(i>0 && i<words.length-1 && SMALL_WORDS.has(lw)) return lw;
      return lw.charAt(0).toUpperCase()+lw.slice(1);
    }).join(' ');
  }

  function monthsAgo(dateStr){
    const [y,m] = dateStr.split('-').map(Number);
    const now = new Date();
    return (now.getFullYear()-y)*12 + (now.getMonth()+1-m);
  }
  function inDateBucket(d){
    const bucket = dateFilterEl.value;
    if(bucket==='all') return true;
    const diff = monthsAgo(d.date);
    if(bucket==='month') return diff===0;
    if(bucket==='lastmonth') return diff===1;
    if(bucket==='older') return diff>=2;
    return true;
  }

  function render(i){
    active = i; const d = DIGESTS[i];
    activeId = d ? d.date+'|'+d.show+'|'+d.theme : null;
    docEl.innerHTML = d ? marked.parse(d.md) : '';
    document.querySelector('.main').scrollTop = 0;
    buildList();
  }

  function buildShowOptions(){
    const shows = [...new Set(DIGESTS.map(d=>d.show))].sort();
    shows.forEach(s=>{
      const o=document.createElement('option');
      o.value=s; o.textContent=titleCase(s);
      showFilterEl.appendChild(o);
    });
  }

  function buildList(){
    listEl.innerHTML='';
    const f=(qEl.value||'').toLowerCase();
    const showSel = showFilterEl.value;
    let shown=0;
    DIGESTS.forEach((d,i)=>{
      if(showSel && d.show!==showSel) return;
      if(!inDateBucket(d)) return;
      if(f){
        const hay=(d.theme+' '+d.show+' '+d.md).toLowerCase();
        if(!hay.includes(f)) return;
      }
      shown++;
      const id = d.date+'|'+d.show+'|'+d.theme;
      const b=document.createElement('button');
      b.className='item'+(id===activeId?' active':'');
      b.innerHTML='<div class="theme">'+titleCase(d.theme)+'</div><div class="meta">'+titleCase(d.show)+' · '+d.date+'</div>';
      b.onclick=()=>render(i);
      listEl.appendChild(b);
    });
    countEl.textContent = shown+' of '+DIGESTS.length+' digest'+(DIGESTS.length===1?'':'s');
  }

  qEl.addEventListener('input', buildList);
  showFilterEl.addEventListener('change', buildList);
  dateFilterEl.addEventListener('change', buildList);
  buildShowOptions();
  if(DIGESTS.length){ render(0); }
  else { buildList(); docEl.className='empty'; docEl.textContent='No digests yet. Run /digest to create one.'; }
</script>
</body>
