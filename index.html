    "md": "# The man who led 100+ CROs — John McMahon on sales fundamentals\n_Topline · John McMahon (5× public-company CRO) · idea/thesis talk · Read time: ~11 min_\n\n**Theme.** Sales leadership is fundamentals executed at scale: hire on character, diagnose knowledge-vs-skill, stay ahead of ramp time, and qualify deals rigorously. He argues AI and platform shifts change *none* of them.\n\n---\n\n## The framework (McMahon is \"a fundamentalist\")\n1. **Outcomes are a function of people, so the leader's main job is talent supply.** Revenue is the sum of individual conversations; the leader controls who's hired, how fast they ramp, and whether they're coached right. All-A hiring with average execution beats all-B/C hiring with perfect execution.\n2. **Hire on characteristics, then build skills and knowledge.** Skills/knowledge are teachable but slow; *characteristics* (intelligence, drive, coachability, adaptability, integrity) aren't teachable and predict who absorbs the rest. Every bad hire he recalls was a character flaw.\n3. **Diagnose with a two-variable model: knowledge vs skill.** A failed \"play\" means either they didn't know what to do (teach) or knew and couldn't execute (reps). Vague labels (\"no grit\") mean the manager can't diagnose.\n4. **Methodology is a rigorous qualification discipline, not a script — and it's technology-invariant.** Find the economic buyer and a real champion; understand how the company actually buys. AI changes how much research each side can do, not what wins.\n\n---\n\n## Part A — Hiring and diagnosis\n\n### A1. Hire on characteristics, not résumé\n**Says.** Takes less experience + strong characteristics over the reverse. Traits: intelligence (\"out-of-the-womb smart\"), drive, coachability, adaptability, integrity — plus \"PhD\" (persistence, heart, desire). Doesn't screen on school; perfect-SAT hires sometimes never made it. Every failed hire traces to a character flaw.\n\n**Underneath.** Skills take repetition, so drive and intelligence set the *rate of acquisition*; knowledge is trainable, so intelligence sets how much sticks; in a startup where product/messaging/competitors shift yearly, adaptability keeps earlier skills valid. Credentials are noisy, gameable proxies for the same traits; a past win can be \"lightning in a bottle.\" Behavioural interviewing probes the disposition directly — and asking for a *second and third* example defeats a rehearsed story (interviewing is itself a practiced skill).\n\n**So what.** Weight stable dispositions over credentials; probe rebound-from-failure with *repeated* examples; test coachability by whether advice changes behaviour next day. (Caveat: his own hires, selectively recalled; \"character\" is unfalsifiable after the fact.)\n\n### A2. Knowledge-vs-skill failure diagnosis\n**Says.** A coach asks of a failed play: didn't know what to do (knowledge) or knew and couldn't execute (skill)? A manager who says \"he lacks grit\" doesn't know what he's talking about.\n\n**Underneath.** The two causes have different fixes — knowledge is taught (fast, cheap), skill is reps-with-feedback (slow). Misdiagnosis wastes effort; character labels are unfalsifiable and carry no intervention, so they shut down coaching. It also screens managers: ask a candidate manager *why* a named rep is failing — the diagnosis quality reveals whether they can coach.\n\n**So what.** Use \"explain why Joe is failing, and his strengths/weaknesses\" as a manager-hiring question — it tests diagnostic capacity directly.\n\n---\n\n## Part B — Running the org\n\n### B1. Manager owns attrition (the \"bathroom mirror\" rule)\n**Says.** He reversed PTC's \"put a bullet in failing reps\" culture. A manager who loses a rep is accountable — they either recruited the wrong person or couldn't train the right one. \"Go look in the mirror and come back and say what *you* did wrong.\"\n\n**Underneath.** If attrition is blamed on the rep, managers have no stake in hiring accuracy or onboarding, and the cost of a bad hire is externalised. Making the manager own it internalises the cost at the decision point (recruiting), where the information and leverage sit — and fixes the manager's learning loop. (Trade-off: can make managers slow to cut.)\n\n**So what.** Attach the cost of failure to whoever made the upstream decision; run post-mortems on hiring/coaching, not on the individual.\n\n### B2. Allocate headcount like a bond portfolio\n**Says.** Average productivity per rep (say $1.2M) sets quota as if the manager hires the heads. A manager running $1.4M/head gets more heads; one at $1.0M gets none — \"you can't make the people you have as productive as average, so why give you more?\"\n\n**Underneath.** Marginal capital should go where marginal return is highest, and current per-head productivity is the best estimate of an added head's yield. It converts a political fight over headcount into an evidence-tied rule and incentivises fixing productivity before asking for more. (Weakness: can starve a hard-but-strategic territory; confound = territory quality.)\n\n**So what.** Tie resource allocation to demonstrated yield per unit, not requests or seniority — after checking for territory confounds.\n\n### B3. Hire ahead of ramp time\n**Says.** \"Ramp time is your enemy.\" Hire next year's reps in Q3, not Jan–Mar (which \"90% of the market does\"). He ran an eight-quarter rolling plan; a $1M beat got half spent on hiring ahead. His miss math: each manager is \"only a month late\" recruiting; 50 regions × $100K/month = the whole multi-million miss.\n\n**Underneath.** Revenue capacity at time *t* depends on heads hired at *t − ramp*, so every month of recruiting delay is unrecoverable lost capacity. Small individual delays add *linearly* across the org into a large aggregate miss. Recruiting is a lead indicator, bookings a lag indicator — waiting for the quarter to start is already too late.\n\n**So what.** Plan hiring at an offset of one ramp length; compute org-wide lateness by summing individual lag. (Works when ramp is long and idle capacity is bearable.)\n\n### B4. Position vs opportunity (career trajectory)\n**Says.** Candidates confuse a CRO *title* at a nowhere company with the *opportunity* of a director title at a great one. Leaders who deliver growth attract followers who take seniority cuts to rejoin (\"people don't leave companies, they leave managers\"). The \"PTC tree\" supposedly spawned 300+ CROs.\n\n**Underneath.** A title is a snapshot; an opportunity is a trajectory, and comp/title growth follow the *slope*. Followership compounds through a trust ledger — people follow leaders who demonstrably raised their capability and earnings.\n\n**So what.** Rank offers by expected trajectory (company, people, scope to prove yourself), not initial title. (The ~17-month average CRO tenure is partly early-promotion/readiness mismatch.)\n\n---\n\n## Part C — Methodology and the AI question\n\n### C1. Qualification = verifying the champion and economic buyer, not that something was said\n**Says.** He dismisses Gong-style tools: \"all they do is verify something was said\" — not *who* said it (coach, champion, gatekeeper, user buyer, economic buyer, or an *enemy*). In a QBR he'd ask 24 questions to test a claimed champion (\"sweat pouring down your forehead\"), and can often spot a \"fox in sheep's clothing\" in five minutes. Even a claimed budget owner gets tested: \"have you ever bought anything for $2M?\"\n\n**Underneath.** Transcripts record *utterances*; deal progress depends on the speaker's role, incentive and power, which aren't in the words. A friendly buyer who shares info isn't evidence of influence — may be a competitor's asset. Real qualification is *adversarial questioning of the rep*, forcing them to separate what they know from what they assume. \"How do things get bought here?\" substitutes a company-specific process map for a generic stage model.\n\n**So what.** Treat any champion claim as a hypothesis and test it with specific evidence; keep the economic buyer as the focus even as buying committees grow (the *Jolt Effect*: ~5 → 13 → 22 people, but one budget owner).\n\n### C2. AI amplifies the gap between good and lazy reps; the methodology doesn't change\n**Says.** \"AI makes good reps better and lazy reps lazier.\" A lazy rep asks AI for an opening POV the customer already heard three times; a great rep uses it to learn the business's risks and how the persona is measured, then differentiates through curiosity, discovery and listening. As every vendor floods the market with AI-tailored positioning, all look alike — *raising* the need for a skilled seller. \"Good luck selling a $10–30M deal with an avatar.\"\n\n**Underneath.** When a tool makes the baseline cheap for everyone, the baseline stops differentiating, so value moves to what the tool can't supply — judgment, curiosity, trust under complexity (the same range-restriction dynamic as Dham's \"callus on growth rates\"). He concedes demand is so high that reps are currently \"order takers\" and nobody knows who's good — competition (OpenAI vs Anthropic at big accounts) will expose it.\n\n**So what.** Test whether an AI-assisted workflow produces insight that *wasn't in the prompt*, or just restates the default. (Thin evidence: a strong prior from one operator; the \"sales won't exist\" counter-view is voiced but not engaged on mechanism.)\n\n### C3. Boundary, not script\n**Says.** Rejects over-scripted \"coin-operated\" selling: \"you have to be yourself.\" Sales is art *and* science (Brady shouldn't throw like Mahomes). Standardize the *checks* (qualification criteria, stage gates), not the dialogue. Same fundamentals across SMB and enterprise — HubSpot's 10-day cycles and 10-month enterprise cycles had the same steps, differently compressed; but \"the Venn of commonalities shrinks at the edges, so ask what's different here.\"\n\n**Underneath.** A methodology fixes what must be *established*, not the words; fixing the words removes the adaptive response where enterprise deals are won. Scripts optimise the mean and variance at the expense of the tail; if you hire A players you can afford wide latitude — so rigor and autonomy are *complements*.\n\n**So what.** Standardize the checks, not the dialogue. Latitude is only safe when selection and qualification inspection are strong.\n\n### C4. The CEO–CRO relationship: partner, not subordinate\n**Says.** Some VC-flush CEOs \"think they know sales,\" resent paying reps $300–400K, and want to sell to everyone at once rather than build an ICP and go down the \"bowling alley.\" A strong CRO says \"that's wrong, and here's why.\" First-time CROs fail by staying silent. His coaching: you have fiduciary responsibility — state the problem *plus a proposed fix*, in business-owner terms; the CEO decides and you live with it. Not raising it is the failure. (Jason Lemkin's counter: a CRO blaming product looks weak — reconcile by speaking as an *owner*, not \"sales complaining.\")\n\n**Underneath.** The failure is information-flow: the CRO sees the market first, so withholding it deprives the company of the only signal that corrects a founder's wrong prior. Framing as problem + solution in business terms converts an emotional \"sales is hard\" into a decision for the owner; the decision right stays with the CEO, keeping accountability clean. Founder over-confidence is selection-induced; the structural remedy is operator board members who can credibly challenge each function.\n\n**So what.** Raise issues early, with a fix, in company terms; reserve product criticism for controlled settings. Evaluate the CEO (ICP discipline, tolerance for being told no) as part of choosing where to work.\n\n---\n\n## References\n- **PTC / MEDDIC (MEDDPICC)** — McMahon's team developed the methodology there; the \"PTC tree\" of 300+ CROs.\n- ***The Qualified Sales Leader*** (his book); ***The Jolt Effect*** (buying committees ~5 → 13–22).\n- **Dali Rajic (OpenAI CRO), Brian McCarthy (OpenAI, ex-Rubrik), Chris Degnan (Snowflake→Cognition), Mark Roberge (HubSpot; non-bag-carrier exception), Brian Halligan, Dev Ittycheria (MongoDB), Frank Slootman** — lineage and leadership examples.\n- **Gong / conversational intelligence** — \"verifies something was said\" without qualification.\n- **Jason Lemkin (SaaStr)** — \"a CRO shouldn't blame the product.\" **Amanda Kahlow / OneMind** — \"sales won't exist in 12–24 months\" (dismissed for complex deals).\n- **Anthropic vs OpenAI** — enterprise competition, commissions/caps. **Crossing the Chasm \"bowling alley\"** — early-market ICP sequencing.\n\n## New concepts (learned today)\n- **Characteristics-over-credentials hiring (PhD = persistence/heart/desire)** — hire on stable dispositions because they set the learning rate; probe with repeated behavioural examples.\n- **Knowledge-vs-skill failure diagnosis** — teach for knowledge gaps, drill for skill gaps; replaces unfalsifiable character labels and doubles as a manager-hiring test.\n- **Manager-owns-attrition accountability** — the hiring manager owns a rep's failure, moving the cost to the party with information and leverage at decision time.\n- **Productivity-gated headcount allocation** — give heads to managers above org-average per-head productivity; capital-allocation by demonstrated yield (watch territory confounds).\n- **Hiring lead-time offset (ramp-time hedge)** — capacity at *t* depends on hires at *t − ramp*; small recruiting delays sum linearly into a large miss.\n- **Champion vs coach vs enemy (stakeholder role typing)** — classify each contact by role and incentive; a transcript can't establish who actually helps.\n- **Fiduciary escalation (CRO–CEO partner framing)** — owe the CEO problems *plus* fixes in owner terms; the failure mode is silence, not disagreement.\n\n## Connections\n- \"AI makes good reps better, lazy reps lazier\" is the sales instance of **AI-as-judgment-amplifier** and of Dham's **range-restriction** (a filter that no longer separates pushes weight to what still varies).\n- The QBR cross-examination is **verified-then-trust** applied to deals — re-ground on directly verified evidence rather than a relayed summary.\n- **Tension:** his claim that methodology is *invariant* under AI is exactly the \"what worked before still works\" prior that other talks this run warn to pressure-test — hold it as a hypothesis, not a finding.\n\n## Left out\nOpening banter, the hedge-fund $100M anecdote, host chatter on job moves, and the closing praise of protégés (\"smart and driven\" with no mechanism) — kept as references. Transcript misspellings (Medic/MEDDIC, Mahomes/\"Holmes\") are guesses."

    "md": "# The Great Tech Selloff — an investor's framework\n_Topline · Rajeev Dham (MD, Sapphire Ventures) · idea/thesis talk · Read time: ~13 min_\n\n**Theme.** A growth investor's read on a public-market selloff in AI-linked tech. His core claim: this is a *timing* mismatch between AI capex (now, visible) and AI returns (later, diffuse) — not a verdict on the technology. From that one claim he re-derives how investing, margins, durability, incumbents and exits all change when companies grow faster than anything in the SaaS era.\n\n---\n\n## The framework (his mental model, stated plainly)\nEverything he says hangs off three load-bearing ideas. Hold these three and you can regenerate the rest:\n\n1. **Duration mismatch.** Costs arrive now and are visible; returns arrive later, diffuse, and aren't yet in aggregate earnings. A selloff is *the market's patience running out before diffusion catches up* — a timing fight, not a refutation of the tech.\n2. **Rates of change swamp levels.** Product, margin structure, even the revenue base change every few months. So durable value lives in *the thing that keeps adapting* — the founder and the operating cadence — not in any static snapshot (growth rate, margin, \"moat\").\n3. **Scarce capital rationed under crowding.** When everyone grows absurdly fast, growth stops being a differentiator; finite capital + more qualifying candidates ⇒ more selectivity, longer diligence, fewer fundable companies and fewer exits.\n\nThe selloff is #1. How investors now judge companies is #2 and #3. The incumbent-vs-native gap is #2 applied to *organisations*.\n\n---\n\n## Part A — The selloff is a timing mismatch, not a verdict\n\n### A1. \"Is the tech real?\" and \"will the stock fall?\" are different questions\n**Says.** The market now wants AI's payoff visible in *S&P 500 earnings*, not just a lab's revenue run-rate. It will tolerate a 1–2 year delay — nobody knows how long. He expects a reconciliation in \"six month, nine month\" terms, not the 7–8 years the post-2000 recovery took.\n\n**Underneath.** A price embeds an *assumed horizon* investors will wait over. Capex front-loads cost; payoff depends on diffusion through customers, which is slow and spread out. So the discount applied to far-off cash flows rises when patience shrinks — a selloff can happen with *zero* change in the technology's long-run value. His 2000-vs-now distinction smuggles in the real claim: in 2000 revenue was often absent (whole price level had to reset); here he believes revenue is already visible. Caveat: the \"short correction\" is a prediction with no mechanism — it rests on the private-market revenue *he* sees, a selected sample. (Contrast: the prior week's guest, Geoffrey Moore, called it a 2008-style *financial* problem.)\n\n**So what.** Separate \"does it create value\" from \"is the value visible on the horizon the market will wait for.\" Watch for the evidence investors are actually asking for (earnings lift, a return metric), not the growth narrative.\n\n### A2. The flat macro metric reflects *exposure*, not *efficacy*\n**Says.** The average Fortune 500 spends ~0.1% of total expenses on AI, while Anthropic reportedly spends more on agents than on everything else combined. A Stripe founder cited ~10% of internal budget on AI; Sam Altman's reported reply: not enough.\n\n**Underneath.** If only 0.1% of spend touches the technology, even a 20× gain *on that sliver* is invisible in aggregate earnings — so the metric the market wants is the wrong instrument this early. The absence of a lift is explained by how little is plugged in, not by weak effect. Diffusion speed is set by organisational *capacity to absorb* (ties directly to C-side ideas and to incumbent inertia below). The labour-TAM upside is a Jevons/elasticity claim: if cost-per-unit-of-work falls 20×, demand for that work *expands* rather than total spend staying fixed.\n\n**So what.** When a macro number is flat, ask what share of the economy is actually exposed before reading a null aggregate as a null effect.\n\n### A3. The fastest growth is lumpy and most exposed to the very risk being priced\n**Says.** By relative growth: data companies, RL-environment sellers, neo-clouds and inference platforms lead (the picks-and-shovels of the build-out); even application companies are growing at rates \"we've never seen.\" Big contracts come from a handful of labs — 3–4 customers can be $70–80M/month. Enterprises now have \"no budget for anything without magical-ROI impact,\" with shrinking time-to-value.\n\n**Underneath.** Revenue concentrated in a few giant buyers is a *derivative* of those buyers' capex decisions — so the fastest growers are the most sensitive to the capex-patience mismatch (A1). Budget compression is a zero-sum claim: AI spend pulled from a fixed pool means anything not visibly worth it gets cut first.\n\n**So what.** When revenue comes from a few giant customers, read it as a bet on *their* capex, not as independent demand.\n\n### A4. Mega-IPOs: short-run liquidity drain, long-run category pull\n**Says.** Anthropic (trillion-plus, raising ~$100B), SpaceX, OpenAI next. He thinks net positive; liquidity hit for 3–9 months. Predicts ~2× the number of SaaS-era IPO names at 5–10× the market caps over 5–7 years; the bar falls but not to dot-com levels.\n\n**Underneath.** Public-market demand for a category isn't a fixed pie — a visible winner *defines* the category and pulls capital toward it (a scarcity effect), so investors hunt for other exposures. Crowding-out is real only in the short run (absorbing a huge raise temporarily drains liquidity). Weakness: assumes sentiment holds, which A1 says may not.\n\n---\n\n## Part B — When everything changes monthly, underwrite the adapter\n\n### B1. Growth rate stops being a signal when everyone grows fast (\"callus on growth rates\")\n**Says.** Deals close at breakneck speed — $15M→$100M, $200M→$600M, one data company ~$900M run-rate within months. There's \"almost a callus\" around growth; it's now a \"gating\" but \"tertiary\" factor. He'd have funded 0→900 blindly five years ago; today a $9M→$38M agent company is hard to get excited about.\n\n**Underneath.** A signal carries information only when it *varies across candidates*. When the population baseline shifts up, the same number separates fewer companies — a range-restriction problem (like everyone getting an A). You must move weight to features that still vary: counter-positioning, founder velocity, shipping cadence. Second effect: finite capital + more candidates clearing the old bar ⇒ even good companies go unfunded (rounds staying open 2–3 months; his firm does ~12 investments/year).\n\n**So what.** When a metric is pushed to the top of its range for everyone, stop using it to discriminate — look for what still varies.\n\n### B2. Founder weight jumps from 30–50% to 80–90%\n**Says.** At growth stage the CEO used to be a 30–50% weight; now \"80, 90%,\" even at a billion run-rate. He asks what the founder did in the *last three months* — how many product announcements, how much rebuilt. Example: founders who rebuilt their whole harness/product after the December model release (the \"Opus 4.5 moment\").\n\n**Underneath.** When every current-state measurement has a short half-life, the best predictor of future position is the *rate and quality of adaptation* — a property of the person deciding. A major model release is an exogenous shock that resets the terrain; agility is what lets a company *use* the shock instead of being disrupted by it. (He adds founders can be great at any age, though stars skew younger — but had no data, so treat as aside.)\n\n**So what.** When the thing you evaluate is in fast motion, evaluate the *process that moves it* — ask for a rate and a response to a shock, not a snapshot.\n\n### B3. Lower % margins, higher $ per customer\n**Says.** Applied-AI may settle ~30% gross margin vs 78–80% SaaS — \"a wistful sentimentality about the golden age of SaaS.\" But if price/customer is ~10× up, \"30–40% of $10,000\" beats \"80% of $1,000.\" He expects services on top to lift toward 60%. He *passed* on a company running 90% of workloads on open-source at ~7% margin — no credible lever to reach 40%.\n\n**Underneath.** Percentage and absolute margin answer different questions. An AI product sells *outcomes that replace labour*, so price scales with the labour budget, not the software budget; inference is a real variable cost that compresses the percentage but not necessarily the dollars. What a business needs is enough absolute gross profit to cover S&M + R&D and throw off cash — \"at the end state every business trades on cash flow.\" His acceptability test is whether there are *named levers* (own post-trained model, 3 calls → 1, cheaper open weights, consumption pricing); no lever = pass. Co-host counter: thin margins cut operating slack (like grocery) and drive consolidation.\n\n**So what.** Judge margin as *dollars* and as a *trajectory with named levers*, not against a benchmark inherited from a prior business model. Ask where the cost floor is and who else shares it.\n\n### B4. \"Land grab\" breaks the old focus rule\n**Says.** Old advice: \"focus, focus, focus\" — one product, one geography — until $50–100M ARR. Now S-curves build at $5–10M ARR with new products, ICPs, pricing models; the best companies' land-grab \"never ends\" (investment banking → corporate banking → wealth → RIAs). Anecdote (via Pat Grady/Sequoia, on *Invest Like the Best*): a board member asked if the founder had the sales capacity to be \"in every room\" if all financial institutions made an AI bet within 12 months — the founder then made the plan *more* aggressive. Most leaders still avoid pure consumption pricing (outside AI coding), using platform/seat/hybrid fees so as not to overcharge.\n\n**Underneath.** Focus was a hedge against thin resources and slow learning. When the market is a *window* (everyone decides in the same 12 months), the binding constraint flips from minimising waste to *ensuring coverage* — being under-built forfeits share permanently. Hybrid pricing is a deliberate trade: consumption ties price to value but creates bill shock; seats are predictable but less aligned — they protect the relationship during the grab.\n\n**So what.** Ask whether the market has a closing deadline. If so, reason about *capacity to capture*, not efficiency.\n\n### B5. Applied-AI companies aren't \"apps\" — they're service + platform + infra\n**Says.** He describes Harvey as \"part McKinsey, part DeployCo, part SaaS agent platform, even part AI-infra / AI-lab-as-a-service.\" The models won't \"eat the harness\"; as intelligence gets more powerful you need specialised vendors *more*. Customers (e.g. law firms) face \"almost McKinsey-like questions\" — pricing, differentiation, org design, training their own models, running evals — that the lab won't answer. A UI is trivial to build with a coding model, so durability comes from being *embedded with the customer*.\n\n**Underneath.** Intelligence is becoming a commodity input; what customers lack is the capacity to turn it into a *changed organisation* — the integration, change-management and domain judgment. Labs optimise for general capability and breadth, so they're structurally weak at the domain-specific, hand-holding layer; as the frontier moves faster, the cost of keeping up lands on the customer, raising demand for an intermediary who absorbs it. Load-bearing assumption: labs won't move into that service layer, and switching cost lives in the embedded relationship, not the software. If a lab ships a good legal product, the claim is tested directly. (Directly counters a \"wrapper decays\" view — his durable thing isn't a wrapper at all.)\n\n**So what.** To judge whether a layer gets absorbed by the one below, ask what the lower layer is structurally *unwilling or unable* to do. Services and relationships are a different asset class than features.\n\n### B6. Incumbent vs AI-native is a different sport — culture, not capability\n**Says.** To a $300M-ARR, breakeven, pre-AI founder he advised: \"do that less, work on AI products more\" — hire a PE-style COO to run the old business, take the learnings, merge the two. Named: Eric at Podium, Owen at Intercom (Fin) — founders who \"burned the boats.\" Co-host Sam: it's culture — two-week sprints, \"we'll put it in the sandbox\" as the entrenched reflex. Anecdote: a CFO leaving an $18B SaaS darling (growing 50–60%) for an AI-native company found \"a whole different ballgame\" — every vendor an AI company, different comms, different headcount ratios. Suggestion: incumbent founders should \"intern\" for a day at AI-native firms.\n\n**Underneath.** A company's operating rhythm is encoded in *beliefs about how long things take* — beliefs set under old constraints that persist after the constraints vanish, because people experience them as normal. The managed business gives small positive local returns (a few % growth) while the new product's option value is far larger, so the real question is allocation of the *scarcest resource — founder attention* — not budget (his 24%-vs-18%-growth example: immaterial next to the new thing's option value). Separating the legacy business under a different operator, then merging, avoids culture contagion.\n\n**So what.** When the environment's constants change, the binding constraint is usually an *internalised belief* about those constants. Look for protected attention allocation, not budget lines.\n\n### B7. \"Spam cannon\" rebuttal: budget size ≠ vendor crowdedness\n**Says.** Co-hosts call GTM-AI a poor sector / a spam cannon. Dham disagrees: sales & marketing is the largest budget line for most companies, so there's perpetual pressure to allocate it better, and \"every year or two\" a new way to grow appears — list-building, \"next best action\" (what works on what channel with what message), an AI-native CRM as a data store, parallel/power dialing. Cited: Clay, Monaco (Sam Blond), dialers; notes Salesforce itself is a GTM company.\n\n**Underneath.** Where a big, measurable budget meets a clear ROI question and constant experimentation, there's structural room for tools even as individual products commoditise. A \"write more emails\" product competes on volume and saturates; the deeper prize is *decision quality* (which action, which channel) — allocation efficiency of a large spend. \"Crowded ⇒ unattractive\" confuses market *size* with market *structure*.\n\n**So what.** Separate budget size from vendor crowdedness. A crowded space over a big budget can still hold a few winners.\n\n---\n\n## Part C — When growth is everywhere, capital gets rationed\n\n### C1. Match decision horizon to payoff horizon (or you just trade on noise)\n**Says.** His job is long-term; holding periods are 3–5–10 years, so \"over-rotating in the moment\" on market jitters \"could lead to adverse selection.\" The goal is simply to back the best founders.\n\n**Underneath.** If your decisions track *sentiment* while payoffs track *fundamentals*, you make systematic errors — you skip deals exactly when prices are cheapest and quality highest. The specific risk is adverse selection: in a panic, the founders who still raise are the ones who *couldn't wait*, so your acting-pool is worse. Matching the decision horizon to the payoff horizon removes that noise. (Counter-effect of the same slowdown: more diligence time — a month vs a day — favours the best-prepared founders.)\n\n**So what.** Ask whether a decision's time horizon matches its payoff's. If they diverge, you're mostly reacting to noise.\n\n### C2. \"Good business\" ≠ \"venture-fundable business\"\n**Says.** Fundable companies are narrowing. VCs chase ~1000% growth, so a 36→72 doubling \"isn't fundable,\" and even buyers for it narrow. A 2015–2021 cohort of $30–100M companies growing 20–40% are \"waiting for the rotation.\" Founders ask: hand capital back? secondary/primary hybrids? move on? He predicts a new \"product of financing\" for these businesses; says buying out investors at a markdown is \"too early.\" The unprofitable-but-fundable path: cut burn, print EBITDA.\n\n**Underneath.** VC returns are power-law, so a fund's constraint is finding the next *outlier*, not funding every project above cost of capital (Asit raised the B-school rule; it holds only if capital is unconstrained and returns independent — venture is neither). A company that can't return the fund isn't worth a fund-sized cheque (\"low return, high risk\" is bad fund design). That leaves a gap between \"good business\" and \"venture-fundable business\" that needs a *different capital structure* — debt, insiders, revenue-based/hybrid — not equity at venture price. The exit squeeze is the same gap seen from the other side.\n\n**So what.** Distinguish \"good business\" from \"good venture investment.\" One company can be both, one, or neither — and different capital structures fit each.\n\n### C3. Why PE hasn't bought the \"tweener\" SaaS yet — and what unlocks it\n**Says.** PE is \"still frozen\" — underwater on big software buys, LPs questioning debt-financed deals. The \"buy and agentify\" play needs talent \"young and close to the metal\"; an operating partner hired to *identify* the business doesn't work at the start of a wave (first-pass AI workflows waste tokens, fail experiments). Once there's an \"agent reference architecture,\" PE plugs it in, gets 5–10 EBITDA points, and has \"a field day\" buying 2015-vintage SaaS. Meanwhile Salesforce buys what PE couldn't afford. Cited: Thoma Bravo, Francisco Partners.\n\n**Underneath.** Playbook-driven buyers create value by applying a *known, repeatable* cost-out recipe — so they stall while the recipe is still being discovered (nothing to replicate; first iteration inefficient) and arrive once it's standard. Standardisation shifts the scarce factor from *frontier talent* to *capital* — which is what PE has. A \"reference architecture\" is precisely what converts a craft into a template. It's a sequencing prediction: early wave = talent-scarce, late wave = capital-and-template-abundant.\n\n**So what.** Ask where on the adoption curve a given buyer type's edge is strongest; watch for the standardisation event that unlocks the next buyer.\n\n---\n\n## References (what each was invoked to support)\n- **Geoffrey Moore** (prior Topline guest, author/venture partner) — the foil: called a bubble certain, compared to **2008** (a *financial* problem) not 2000. Dham's duration-mismatch view is the counter.\n- **2000 dot-com bust** (7–8 yr recovery) — argument that *this* correction is shorter because revenue exists now.\n- **Amazon / AWS (~2010)** — capex doubted, then paid off in 4–5 years; the \"patience is rewarded\" analogy.\n- **Google (−12% post-earnings), Amazon, Meta, Intel** — examples of the selloff / free-cash-flow worry.\n- **Anthropic S-1 / IPO** — diffusion stats (enterprise ~0.1% of spend on AI; Anthropic spends more on agents than other costs) and the IPO bellwether (~$100B raise, trillion-plus).\n- **OpenAI, SpaceX** — IPO supply / liquidity absorption.\n- **Databricks, Stripe, Revolut, Anduril** — next-tier IPO candidates.\n- **Salesforce, CrowdStrike, Datadog, Zoom, Figma** — SaaS-era IPO class as a sizing benchmark; Salesforce also as acquirer and GTM proof point.\n- **Harvey** — the \"part McKinsey / DeployCo / platform / AI-lab-as-a-service\" description; negative gross margin raised by a co-host; beachhead-and-expand pattern.\n- **Baseten, Fireworks** — inference providers used by the ~7%-margin company he passed on.\n- **Opus 4.5 \"moment\" (December)** — the model release that forced founders to rebuild their harness.\n- **Pat Grady (Sequoia)**, via a founder on ***Invest Like the Best*** — the capacity-vs-opportunity board anecdote behind aggressive land-grab.\n- **Podium (Eric), Intercom/Fin (Owen)** — founders who \"burned the boats\" and merged old + new.\n- **Thoma Bravo, Francisco Partners** — PE firms not yet buying.\n- **McKinsey** — the advisory layer of applied-AI vendors.\n- **\"Reference architecture\"** — the standardisation that unlocks PE.\n- **Clay, Monaco (Sam Blond), parallel/power dialers; HubSpot, Salesforce** — GTM-AI examples / incumbents.\n- **Sequoia's $10T services TAM** — the claim that agents address labour spend.\n- **Stripe founder ↔ Sam Altman** (\"10% of budget… not enough\") — slow diffusion even among leaders.\n- **B-school cost-of-capital rule** — Asit's \"fund everything above the hurdle,\" rebutted by opportunity cost / power-law.\n- **Adam Robinson** (late bootstrapped founder) — opening tribute; an illustration of a profitable, boundaried, small-team company (context, not an idea).\n- **Sapphire portfolio cited** — Harvey, Baseten, OpenEvidence, Clay, Glean, Monday, LangChain.\n- Metaphors: **football vs cricket** (SaaS vs AI-native playing fields); **grocery stores** (thin margins → consolidation).\n\n## New concepts (learned today)\n- **Duration mismatch (capex vs visible return)** — front-loaded spend whose payoff is diffuse and lagged; markets can reprice a sound technology purely because their patience horizon is shorter than the diffusion horizon.\n- **Exposure-vs-efficacy in aggregate metrics** — a flat macro number may reflect tiny *exposure* (~0.1% of spend) rather than weak effect; even a 20× gain on a sliver is invisible in aggregates.\n- **Range-restriction in a screening signal** — when a population's baseline shifts up (everyone grows 5–10×), a ranking metric loses discriminating power; weight moves to features that still vary.\n- **Founder weight as an adaptation-rate proxy** — when current-state metrics have a short half-life, investors weight the founder's recent *rate and quality of rebuilding* in response to shocks.\n- **Dollars-over-percent margin logic** — a lower margin % can yield more absolute gross profit when price/customer rises ~10×; acceptability hinges on credible *levers* to improve it.\n- **Playbook-buyer timing (PE & reference architecture)** — repeatable cost-out buyers arrive *late*, once a standard \"reference architecture\" turns a talent-scarce craft into a template.\n- **Venture-fundable vs good-business gap** — power-law fund economics mean a solid business that can't return a fund isn't fundable at venture price; it needs a different capital structure.\n- **Applied-AI vendor as services-plus-platform** — the (weakly-evidenced, one-investor) claim that durable app-layer AI firms bundle consulting-style change management + forward deployment + platform + in-house model work, so labs don't absorb them.\n\n## Connections\n- **Agrees with** the earlier \"no permanent moat / continuous reinvention\" thesis (prior Topline/How-I-AI runs) — his rate-of-change framing is the same spine. **But goes further and partly disagrees:** he leans on a *specific durability claim* (the services-plus-platform vendor), where the pure reinvention view says the durable thing is only the adapting itself.\n- **Tension with** a \"foundation-model wrapper decays\" view: B5 argues the durable layer isn't a wrapper at all but embedded services — a direct counter worth holding both sides of.\n- B2/B6 (founder adaptation; incumbent habit-entrenchment) are the organisational version of A2's diffusion point: *capacity to absorb* is the real gating variable everywhere in his model.\n\n## Left out\nOpening tribute to Adam Robinson (kept only as a reference), host banter and the guest-contact outro, repeated restatements of \"growth is crazy,\" and the younger-founders aside (he had no data for it)."

    "md": "# \"Zero chance the bubble doesn't pop\" — Geoffrey Moore on who's safe\n_Topline · Geoffrey Moore (author, *Crossing the Chasm*) · idea/thesis talk · Read time: ~12 min_\n\n**Theme.** Moore applies his adoption and strategy frameworks to the AI boom: the capital markets are over-extended while the technology is real; value pools at #1 and #2 in each category; and the actual returns come from releasing \"trapped value\" in operating models, not from cutting labor.\n\n---\n\n## The framework (Moore's layered model)\n1. **Value is a stack of powers, and higher layers dominate.** Investors pay for performance but pay a *multiple* for *power* (how confidently future performance can be projected). The five powers, in priority: **category → company → market → offer → execution.** Category power creates bubbles; once a category settles, company power takes over and is brutally concentrated (#1 gets 1×, #2 ~0.5×, #3 ~0.25×, then near-zero).\n2. **Return comes from releasing trapped value, not from technology as such.** Every operating model has a structural gating item that stops it being 2× as productive. Technology *moves* trapped value; it never eliminates it. The durable position is being the specialist in the next layer of it.\n3. **Adoption speed is the governor, not innovation speed.** Innovation has outrun adoption (bounded by liability, regulation, the need for deterministic transactions with accountable humans). The gap between the two *is* the bubble.\n\n---\n\n## Part A — The bubble is a category-power bubble, and winners still win\n\n### A1. \"Is the tech real?\" and \"will the stock pop?\" are independent questions\n**Says.** \"There is zero chance this bubble doesn't pop\" — valuations are \"over our skis,\" with circular financing like the dot-com era; he compares it to 2008, not just 2000. But #1 and #2 get through; ranks 3–10 don't.\n\n**Underneath.** Category power only sets the *ceiling* on the pie; revenue/margin then distribute via a power-law pecking order. A build-out sized for a category with ten funded players only pays back if all ten earn returns — they can't, so the math fails below rank 2. Herd behaviour makes the correction a *sentiment* event, not an engineering one (he cites 1987's −22% day). A pop needn't kill the survivors — the 2008 analogue is financial decision-making, not operational failure.\n\n**So what.** Separate \"is the tech real\" from \"are these valuations sustainable.\" Rank 3+ carry the pop risk; #1 and #2 don't.\n\n### A2. Commoditization raises GDP but concentrates the profit pool\n**Says.** AI makes productivity cheap and ubiquitous — great for #1 and #2, \"but after that there's not enough margin to pay for the build-out.\" Best example: Wintel (the top player lives well, #3 can't). A guest adds Toyota/Ferrari: frontier intelligence (high margin) vs community-college intelligence (commodity, electricity-like).\n\n**Underneath.** In a commodity market, margin is set by the marginal producer's cost, so only players with scale or ecosystem lock-in keep a surplus. A *standard* (Windows, x86) turns the leader's position into a platform others make a living on; second-tier gets priced to cost. (Moore's twist on \"IT Doesn't Matter\": leaders in a commoditized layer still earn rent.)\n\n**So what.** When an input commoditizes, ask whether its supplier has a *platform + ecosystem* or is a cost-plus producer. Pricing power attaches to the former.\n\n### A3. Trapped-value analysis\n**Says.** \"Ask why an industry can't be twice as productive\" — there's always a structural reason (taxis: owning cabs, broken dispatch, street-corner hailing; retail: going to the store; education: time-taught vs learned). \"Trapped value never goes away, it just goes somewhere else\" — like traffic (widen the freeway, the jam moves) or the second law of thermodynamics.\n\n**Underneath.** Operating models are constraint systems; productivity is limited by the *bottleneck*, not the average (theory of constraints). Removing one constraint exposes the next, so value release is a *continuous process*, not a one-time capture — which is why it's a better moat than a feature (features commoditize; constraint-hunting skill compounds with domain depth).\n\n**So what.** Evaluate a company by what structural constraint it removes and where the bottleneck goes next. The defensible position is expertise in the constraint-hunting itself — not \"build a vertical product.\"\n\n---\n\n## Part B — Where the ROI actually is\n\n### B1. AI ROI comes from quality and latency, not labor cuts\n**Says.** A host argues AI must eat labor budget to justify spend. Moore pushes back twice: returns \"are coming from quality improvement and latency reduction, not labor reduction\" (labor cuts are \"possible but not necessary\"); and the budget framing is static — \"the economy is not zero-sum,\" new capabilities create spend that had no budget line (per-account microsites for 500 companies; a ChatGPT agent that 10×'d one buyer's cart).\n\n**Underneath.** The static-budget view treats the economy as fixed slices; the real mechanism is *demand creation* — a price/latency collapse makes previously uneconomic actions viable (induced demand / Jevons). The test is whether ROI exceeds the *displaced* spend. (He concedes this is \"me being very optimistic.\")\n\n**So what.** Ask whether an AI case rests on headcount reduction or on a change in the transaction's quality/speed. The latter dodges the accuracy objection and doesn't depend on the labor budget.\n\n### B2. Probabilistic front-end, deterministic back-end, human as the accountable middle\n**Says.** Transactions must *end* deterministic (you can't \"put $12 in the system of record\" when the price is $10 or $15) but *begin* probabilistic (\"what shoes would you like?\"). Agents can do the front; they'll err, but so do people. \"AI can be accountable, but it cannot be responsible.\" So for ~10 years: human in the loop, sampling, then a deterministic commit.\n\n**Underneath.** Every business process is a funnel from fuzzy intent to a committed, auditable state. AI is cheap at the fuzzy end and unfit at the commit end, because commitment needs a *liable party*. Accountability (auditable) differs from responsibility (can be penalised), and responsibility needs a legal person — so the human-in-the-loop is a feature of the liability regime, not just an accuracy patch.\n\n**So what.** Put the probabilistic part at intake and a deterministic, checked transaction at the end. Decide, per function, where legal/moral responsibility sits and keep a human there.\n\n### B3. Innovation speed ≠ adoption speed\n**Says.** \"The speed of innovation has never been faster. The speed of adoption has not changed.\" Software adopts fast; government, construction, healthcare, education don't. Individual use (tinkering with Copilot) is near-zero-risk, giving a misleadingly rosy view; the chasm bites when you re-engineer a regulated org's workflow.\n\n**Underneath.** Adoption is limited by the slowest of risk, liability, integration and habit change — none of which scales with model capability. Capital is priced on innovation speed while revenue follows adoption speed; that gap *is* the bubble (the same Duration-mismatch gap as the Dham episode).\n\n**So what.** Distinguish individual-use adoption from institutional workflow adoption; estimate timelines from the target industry's adoption constraints, not capability curves.\n\n---\n\n## Part C — Strategy frameworks for the moment\n\n### C1. Where agentic AI sits: the bowling-pin test\n**Says.** Crossing the chasm = in at least one industry, for one use-case class, the tech is the de-facto standard any pragmatist would use. Claude Code is clearly across in software dev. But the *bowling-pin* effect (success in one niche knocks over adjacent ones) hasn't clearly happened — contact-center voice is the test (\"if you never heard an IVR again\"). Copilots are \"inside the tornado\"; autonomous agents are still pre-chasm. He expects agents to institutionalize in early 2027.\n\n**Underneath.** A chasm crossing is a reference-able, standard whole-product solution in a *beachhead*, not overall usage. The diagnostic is whether the *next* niche is falling, not how big the first one is.\n\n**So what.** Check whether a pragmatic buyer in a *second* use case treats it as the default, and whether pins are falling. A big first segment with no spillover is still pre-chasm.\n\n### C2. Zone to Win — the path out of the pilot trap\n**Says.** Four zones: **performance** (this quarter's number), **productivity** (shared services), **incubation** (fail-fast disruptor units), **transformation** (all-in category move, usually only under existential threat — Jobs, Bezos, Gerstner-at-IBM). Pilots succeed in incubation but can't leave it. The path out: (1) PMF in incubation; (2) the firm becomes *customer zero* by re-engineering its own productivity zone (valued for service/velocity/latency, not cost-cuts); (3) roll into the performance zone use-case by use-case, with sales given a protected share of portfolio.\n\n**Underneath.** Each zone has a different failure tolerance and incentive system, so \"fail fast\" is right in incubation and fatal in performance. Working backward from the P0 requirement turns an unbounded optimisation into a *budget allocation*. Customer-zero converts an unproven technology into a proven one with internal references — the chasm solved *inside* the firm.\n\n**So what.** When a pilot \"works\" but won't scale, diagnose *zone mismatch*; get internal-use proof first, then sequence into revenue one use-case at a time.\n\n### C3. Moats are floating; moat stability inversely tracks category growth\n**Says.** Wants \"floating moats\" (a battleship whose moat can migrate, not a fixed castle). Real moat-makers are the three value disciplines (Treacy & Wiersema: operational excellence, customer intimacy, product leadership) — pure product/tech leadership is *not* a moat. Slow industries have long moats (combustion engine 100 yrs) but don't look great on stock performance; \"the stability of the moat and the growth rate of the category are inversely correlated.\"\n\n**Underneath.** A moat is what stops competitors copying your advantage; in fast-moving tech the copy time is short, so the moat decays. Moat durability is a function of the category's rate of change — which is also what drives growth. High-growth categories are high-churn for incumbents.\n\n**So what.** Judge moat claims against the category's rate of change. In a fast category a \"moat\" is a *decay rate*, not a barrier — prefer frames (comparative advantage, trapped-value specialization, reinvention capability) that assume the advantage must be re-earned.\n\n### C4. Downturn startups + provocation selling\n**Says.** \"During a downturn, provoke your customer\": in a downturn customers only spend on what's broken, and those markets are too small for incumbents — so startups win by narrowing. The test: **big enough to matter, small enough to lead, gnarly enough that big players avoid the last mile, a fit with your crown-jewel tech.** Provocation selling: open with a *specific hypothesis* about the buyer's operating pain (\"here's what we think the problem is — are you having it?\"); either answer is informative.\n\n**Underneath.** Market size is relative to the entrant — an incumbent's opportunity cost makes a niche uneconomic while the same niche is a whole business for a startup. An open discovery question puts problem-definition work on the buyer; a falsifiable hypothesis shows expertise and is informative on a \"no.\"\n\n**So what.** In downturns, target a specific broken thing in a niche too small for incumbents; open sales with a falsifiable hypothesis, not an open question.\n\n---\n\n## References\n- ***Crossing the Chasm*, *Zone to Win*, *Escape Velocity*** (Moore's books) — chasm/bowling-pin/tornado; the four zones; the hierarchy of powers.\n- **Treacy & Wiersema, *The Discipline of Market Leaders*** — the three value disciplines as moat-makers.\n- **HBR \"During a downturn, provoke your customer\"; Challenger selling** — provocation selling.\n- **Wintel (Microsoft/Intel); Toyota vs Ferrari; electricity; AWS billing** — commodity-with-a-leader economics; expected AI consumption-pricing end state.\n- **Uber, Amazon Prime, Google Search, Khan Academy** — trapped-value examples (Google launched with no business model: \"ubiquity now, revenue later\").\n- **Jobs, Bezos, Gerstner (IBM 1992), Walmart vs Amazon** — transformation-zone examples; \"54 iconic market leaders that no longer exist.\"\n- **Salesforce (the \"SaaSpocalypse\" call, \"headless,\" Data Cloud), SAP (ABAP), Epic, Databricks, Sierra (Bret Taylor), Veeva** — systems-of-record / platform-vs-product examples.\n- **Dot-com, 2008, 1987 crash** — bubble analogues. **ATMs/tellers, firemen on trains** — jobs-disappear analogies.\n- **Second law of thermodynamics; traffic induced demand** — trapped-value analogies. He wouldn't buy Anthropic, OpenAI or SpaceX at current prices.\n\n## New concepts (learned today)\n- **Hierarchy of powers (category → company → market → offer → execution)** — investors pay a multiple for *projectability*; category power sets the pie, company power is a 1/½/¼ pecking order, tier-two firms survive by finding a *market* (niche) to lead.\n- **Trapped-value analysis** — ask why an industry can't be 2× as productive; the answer is a structural gating item; technology moves the trapped value, never removes it, so the moat is being the specialist in the *next* layer.\n- **Zone to Win (four zones)** — performance / productivity / incubation / transformation, each with a different failure tolerance; pilots stall because they live in a zone whose rules block migration.\n- **Customer-zero rollout** — reach PMF in incubation, re-engineer your own productivity zone first (value = quality/velocity/latency), then roll into revenue work use-case by use-case.\n- **Probabilistic-in / deterministic-out transaction** — AI fits the fuzzy front; the auditable commit needs a *responsible* (liable) human — \"AI can be accountable but not responsible.\"\n- **Innovation-speed vs adoption-speed** — capability outruns institutional adoption (liability/regulation/habit); markets priced on the former against revenue following the latter = the bubble.\n- **Moat-stability vs category-growth inverse correlation** — long-lived moats live in slow categories; in fast categories a \"moat\" is a decay rate.\n- **Bowling-pin test for chasm crossing** — crossed = a second, adjacent use-case treats it as default; a big first segment with no spillover is still pre-chasm.\n- **Big-enough-to-matter / small-enough-to-lead** — a downturn niche must matter to you, be leadable, be gnarly enough to repel incumbents, and fit your core tech.\n\n## Connections\n- Directly reinforces the **Dham \"Great Tech Selloff\"** digest this run: both are the *duration/adoption mismatch* — a real technology mispriced because the market's patience is shorter than the diffusion horizon. Moore adds the power-law \"who survives\" layer and the adoption-constraint mechanism.\n- His probabilistic-in/deterministic-out + human-as-accountable echoes the **IRCTC freeze-then-commit** and **guardrailed-sliver** patterns — put the irreversible commit behind a liable gate.\n\n## Left out\nHost banter and intros, the \"Moore speaks both sides\" aside, and the closing book plug (kept the Anthropic/OpenAI/SpaceX \"no\" and book names as references). Transcript has auto-caption errors (\"Entropic\"→Anthropic, \"Zone to One\"→Zone to Win). Most claims are judgment and analogy, not data; the 10-year human-in-the-loop timeline and \"labor cuts not necessary\" are flagged optimistic."

    "md": "# Scaling Slack and GitHub\n_The Pragmatic Engineer · Maude Lemaire · deep-dive (where load actually breaks a system) · Read time: ~11 min_\n\n**Theme.** Where load really breaks a system (fan-out, shard layout, hidden query cost), how to test for it cheaply, and why a platform engineer still verifies AI output by hand.\n\n---\n\n### 1. Quadratic fan-out: one reaction becomes a million events\n_In a broadcast system, cost = events generated × audience, and when the audience generates the events, load goes roughly N²._\n\n**The setup.** A CEO posts \"you all get Friday off\" to a channel of ~100,000 active users. Everyone opens it and adds a reaction within seconds. Each reaction fans out over WebSocket to all 100,000 clients — one reaction = 100,000 events; ten = a million. Slack ranked WebSocket message types and, under load, dropped emoji events before text (\"messages with text are more important than emojis — that's a product call\"), and capped distinct custom emojis per message at 23 (unlimited \"+1\"s).\n\n**Why it works (first principles).** Reactions come from the audience, so events grow with N and delivery grows with N again — load is roughly quadratic and *synchronised by one shared trigger*. Two levers: bound the event count, or bound the per-event cost. Neither is engineering-only, because what's safe to drop depends on user-perceived value. Unbounded user-generated events attached to one shared object (a counter, a reaction, a presence ping) are a *latent amplifier*; the cheapest fix is usually to cap the semantic range (nobody notices the 24th distinct emoji, or show \"99+\" instead of an exact count). Ownership mattered too: emoji had no clear owner, so nobody had authority to set the limit.\n\n**When & what it costs.** Any broadcast system where recipients emit back. Find the shared trigger, count the events each recipient can emit in response, and rank traffic by value so the degradation order is set *before* an incident.\n\n---\n\n### 2. Event flood ≠ thundering herd — the heaviest users break first\n_A herd is a server-side aggregate problem; a flood is a per-recipient fan-in problem, and your load tests miss it._\n\n**The setup.** An IBM admin was in ~30 workspaces at once, each with its own connection. A message to a company-wide shared channel arrived 30 times with no dedup, and his client kept dying. Slack's WebSocket servers were never the bottleneck — client handling and the downstream events a received message triggers were.\n\n**Why it works (first principles).** These are different bottlenecks: the herd is server-side aggregate capacity; the flood is *fan-in* at one recipient (membership count × per-channel activity). Server load looks fine while one heavy-membership user drowns, and averages hide the tail where the heaviest users sit. Duplicate delivery (one logical event via N routes) is a design smell.\n\n**When & what it costs.** Measure per-user inbound event rate at high percentiles, not just aggregate throughput; dedup at the connection layer when one entity maps to many subscriptions; treat your most engaged users as the leading indicator of client-side scale failure.\n\n---\n\n### 3. Shard by the smallest logical unit, not the tenant\n_Tenant-per-shard has a hard ceiling at your biggest tenant, and the tenant distribution has a heavy tail._\n\n**The setup.** Early Slack sharded by team (workspace); a bigger customer just got a bigger database. \"Enterprise\" was only another row in the team table, so IBM-scale companies all hit the same enterprise shard for DMs and company-wide channels. Slack moved to Vitess and resharded much data by *channel ID* — \"the smallest, most logical unit.\"\n\n**Why it works (first principles).** Vertical scaling of a tenant-per-shard model caps at the largest tenant. A good shard key is high-cardinality *and bounded in size* and matches the access pattern's natural unit — a channel never grows past one machine, so it spreads load evenly. The tension: the key for load balance may differ from the key for product features (cross-team DMs needed an overarching entity), and pretending sub-units were independent companies bought time but created complexity at every cross-boundary seam.\n\n**When & what it costs.** Ask whether any single key value can outgrow one machine; if so, pick a finer key. \"Make the big customer a bigger box\" is a deferral, not a design.\n\n---\n\n### 4. Few shards + scatter queries lock each other in\n_A query without the shard key must hit every shard and wait for the slowest — so adding shards makes those queries worse, which pins the shard count._\n\n**The setup.** At GitHub, all PRs and issues lived on *16* Vitess shards. More shards were ruled out because of **scatter queries** (no shard key → fan out to every shard, merge results). In a Rails/ActiveRecord monolith the SQL is hidden (\"in a five-line function I couldn't see where the SQL was made\"); the repo landing page issued 100+ MySQL queries across ≥3 clusters, and almost every count was computed live. Her playbook: burn down scatter queries, then reshard.\n\n**Why it works (first principles).** A scatter-gather query costs O(shards) and its latency is the slowest shard (tail-dominated). So the system sits in a *local minimum*: shards can't be added because of scatter queries, and scatter queries can't be removed cheaply because an ORM hides query shape from the author and no one sees the cost of a new line. Fix order: make queries visible → find non-key access paths → add secondary lookup keys / denormalised mappings → reshard. Slow because new scatter queries keep being added while old ones are rewritten.\n\n**When & what it costs.** Treat \"queries without the shard key\" as a budgeted metric from day one; make query cost visible at the call site; weigh an ORM's convenience against its hidden cost; reduce displayed exactness (\"99+\") when the product doesn't need it.\n\n---\n\n### 5. Load-test the load-bearing behaviour, not the whole client\n_A load test must reproduce what actually breaks the system, and nothing more — fidelity per dollar is the metric._\n\n**The setup.** Slack needed to test 500,000 live WebSocket connections (COVID pulled an 18-month plan forward). Headless-Chrome Slack clients in Kubernetes cost ~37¢/instance/5-hr tranche (~$150k) and spent half the time restarting crashed pods. The replacement: lightweight Go processes each holding a WebSocket and replaying API calls (including edge-cache requests), fed by a *recorder* (a slash command capturing every API/WebSocket message in a flow) and a script generator. PMs later recorded their own flows to run continuously.\n\n**Why it works (first principles).** Reproduce only the load-bearing behaviour: stateful long-lived connections, fan-out receipt, edge-cache reads. Rendering a UI isn't load-bearing for backend capacity and is memory-expensive, so browser fidelity-per-dollar is terrible. Start from how the system has *historically* failed (herds, fan-out) — that tells you which behaviours to model, and the model must be cheap enough to rerun. Lower fidelity is fine if it's *explicit*: you know which failure class it won't find. Record-and-replay solves the real hard part — knowing every API a flow touches.\n\n**When & what it costs.** Define the usage pattern you fear first; a test you can't afford to rerun isn't a regression test; prefer record-and-replay over hand-authored scripts; accept (knowingly) a different failure mode than the one you tested.\n\n---\n\n### 6. Migrating a hot data model: wrapper, double-write, shadow-read — and the flag-state trap\n_Each step must be independently reversible and verifiable; the disaster comes from coupling a destructive op to a flag that makes the new store authoritative._\n\n**The setup.** Slack's channel membership was split across three tables with ~400 raw SQL call sites and no data-access layer. Lemaire first *mechanically wrapped* them in a named class (copy-paste, no optimisation), then put the migration behind many feature flags, ran double-writes + backfills, then shadow-reads with warehouse dashboards diffing old vs new. After seeing discrepancies she habitually nuked and re-backfilled the new table — forgetting the \"read from new table\" flag was on for all internal users — and blanked everyone's sidebar for ~25–30 min (noticed by one person, during a social hour). She flipped the read flag back while re-backfilling.\n\n**Why it works (first principles).** The sequence (seam → dual-write → backfill → shadow-compare → cut over reads → delete old) works by making each step independently reversible and verifiable. The failure coupled a *destructive* op (rebuild the new store) to a *state* (the read flag) that made that store authoritative — a rebuild script must assert that *nothing reads the thing it's about to destroy*. A migration needs flag, store and runbook to agree on the source of truth at every moment; a thin wrapper also stops the old pattern being copied into new code during a long migration.\n\n**When & what it costs.** Make destructive scripts assert the read-path state first (or build into a shadow table and swap); don't treat internal traffic as a safe test of a risky cutover; keep a one-flag rollback ready while any backfill runs.\n\n---\n\n### 7. Where AI helps and fails in performance work (and why platform people verify by hand)\n_Performance is Amdahl's law on a critical path; a local optimisation that looks right on a diagram is useless without usage-weighted measurement._\n\n**The setup.** Lemaire says AI has \"not helped me with performance optimizations, basically, at all\" in the investigation phase (implementation somewhat faster). Cutting time-to-first-token at Cursor, the LLM instrumented poorly (missed async paths; traces with millions of useless spans elsewhere, none in others; sampling added in several places when it belongs in one). She read the code herself and annotated an LLM-generated sequence diagram on blueprint paper. The model proposed parallelising independent tasks — a waste, because the longest task still dominated and only ~1% of users ran the others. Real wins were mundane (longer Redis TTLs). LLM-written tests confirm what the LLM just wrote, so she runs mutation tests to force edge-case coverage.\n\n**Why it works (first principles).** Speedup comes only from shortening the longest *dependent* chain, weighted by how many users hit it (Amdahl). An LLM sees code structure but lacks the workload distribution, privacy/cost constraints and product context that decide what's cacheable and why. The self-confirming-test problem is generator-checker correlation; mutation testing breaks it by injecting faults the tests must catch. Sampling must be *one* decision point, or downstream fractions multiply and the data becomes uninterpretable. Her platform rationale: if the foundation covers 80% of the house, the AI \"will just build an extra bathroom past the foundation\" rather than ask whether it should.\n\n**When & what it costs.** Use the model for exploration/implementation, but derive the bottleneck from measurement and a hand-read of the real dependency graph; ask \"who actually runs this path\" before parallelising; put cost-sampling at one place; cap trace span counts; mutation-test AI-written tests.\n\n---\n\n### 8. Rotate platform and product engineers; guardrails must keep pace with AI-speed shipping\n_Platform work is a shared-cost abstraction that stays correct only while its designers see the real consumer workflow._\n\n**The setup.** Platform teams form when product engineers hit the same problem 2–4 times and want to solve it once — but platform engineers then drift from what product development feels like, and a chasm opens. Lemaire recommends rotation (a core group plus a product engineer always on rotation), compares it to embedded SRE, and says AI \"spaghetti\" now wants to spill off the plate, so enforcement must move from human review to automated, preventive checks.\n\n**Why it works (first principles).** Distance from the consumer causes drift in both directions (platform builds the wrong guardrails; product ignores the platform). Rotation moves tacit knowledge across the boundary cheaply. As generation speed rises, the cost of an unguarded mistake rises, so review shifts from humans to automated gates in the platform.\n\n**When & what it costs.** Rotate people across the boundary on a schedule; judge guardrails by what the fastest shippers are now doing, not past norms; give performance and reliability explicit owners inside product teams.\n\n---\n\n## References\n- **Camille Fournier / *The Manager's Path* / Rent the Runway** — Lemaire's first job and mentor into Slack.\n- **Slack vs HipChat; Uber (Uchat on Mattermost)** — the host's 2016 context on single-room scale limits.\n- **IBM, Comcast, Amazon (~500k users)** — enterprise customers where team-sharding broke; COVID pulled the load test forward.\n- **Cal Henderson / Flickr / Slack's early PHP (Hack)** — why the code was procedural with raw SQL.\n- **Vitess** — dynamic MySQL sharding at Slack and GitHub.\n- **Rails / ActiveRecord / Prisma** — hidden vs visible query structure.\n- **Koi Pond** — Slack's internal load-testing system.\n- **Embedded SRE model** — analogy for rotating product/platform engineers.\n- ***Refactoring at Scale*** (Lemaire's book).\n\n## New concepts (learned today)\n- **Scatter query / shard-count lock-in** — a query lacking the shard key fans out to every shard and waits for the slowest, so its cost and tail latency grow with shard count; a system full of them can't add shards until they're removed or indexed around.\n- **Quadratic fan-out amplification (reaction storms)** — where recipients emit events back to the group, one trigger yields ~N² load; mitigate by capping the expressible range or dropping low-priority event classes (a product call).\n- **Event flood (fan-in overload)** — a single client overwhelmed by inbound events (duplicates of a shared channel across many connections); hits the heaviest users, invisible in server aggregates.\n- **Behavioural-fidelity load testing** — simulate only the load-bearing behaviours with lightweight workers plus record-and-replay of real flows; accept lower fidelity explicitly.\n- **Single-point sampling (tracing)** — apply cost-driven trace sampling at one place; sampling at several stages multiplies keep-rates and makes data uninterpretable.\n- **Mutation testing to audit AI-written tests** — inject small faults to check the tests fail; counters the tendency of LLM-written tests to confirm their own code.\n- **Flag-state vs destructive-script coupling** — a rebuild/delete on a new store is dangerous if a flag still routes live reads there; check the read path before destroying.\n\n## Connections\n- Priority-ranked WebSocket dropping (1) is **panic-mode / priority load-shedding** done by message type — same shape as the Hotstar/JioCinema digests.\n- Behavioural-fidelity load testing (5) is the cousin of **game-day / rated-capacity** testing: learn rare high-load behaviour before production.\n- The self-confirming-test finding (7) is the **self-check illusion** (correlated verification); rotation + automated gates (8) is the **generation-cost-collapse** shift of review from humans to machines.\n\n## Left out\nSponsor reads, the personal-background opening, the Cursor HTTP/2/gRPC streaming aside (in passing), and the host's recap."
