    "md": "# How Reddit's designers build ultra-realistic prototypes\n_How I AI · Blair Metcalfe (principal UX engineer, Reddit) with Claire Vo · deep-dive (a prototyping harness) · Read time: ~9 min_\n\n**Theme.** A company-built prototyping harness (\"Reddit Proto\") that hides git from designers and PMs, runs prototypes on *live signed-in data*, and grounds the LLM in a token/component map of the real design system — to make design feedback and engineering handoff cheap and high-fidelity.\n\n---\n\n### 1. The harness as \"rails\": constrain the builder's degrees of freedom so non-engineers can generate freely\n_Generating is cheap; reviewing and selecting is expensive — so the system must make the reviewer's job cheap._\n\n**The setup.** A desktop app \"obfuscates all of git.\" You press \"new project\" and land in a vibe-coded environment on a baseline scaffold of the whole app — a \"mountain\" that absorbs each new feature, so it stays everyone's starting point. Built-in controls let the author toggle features, *lock navigation* (\"some stakeholders click too much\"), switch device/theme/persona (e.g. moderator), and deploy to an internal Vercel-like service on Kubernetes.\n\n**How it works.** The harness removes decisions that don't carry design information — repo state, branches, deploy, which design-system parts to use — and lets the author scope what the audience may explore. Every project forks from a faithful copy of prod, so the prototype starts *near prod* and only the delta is new, keeping both the diff and the review small.\n\n**Why it works (first principles).** A guardrail on *what is possible* is what lets non-experts be trusted with a powerful tool — it works by raising the *floor* of quality, not the ceiling. A prototype with every path live invites wandering; locking navigation turns it into a *controlled experiment* where one variable is shown.\n\n**When & what it costs.** Put the effort into the environment (defaults, locked-down parts, state-switchers) rather than into training people; add controls aimed at the *viewer* as well as the author. The standing cost is maintenance — the scaffold must keep tracking prod (\"absorb the mountain\"). (Evidence is a single internal demo.)\n\n---\n\n### 2. Fidelity-of-data determines the credibility of feedback\n_Keep real the property the decision depends on — for a personalised product, that's the data, however crude the visuals._\n\n**The setup.** Beyond mocked data, the prototype lets you *log in and render your own production data* — \"Reddit has personalized data.\" Designers mock a feed in Figma and leadership says \"this isn't relevant to me.\" In the demo, search was prototyped in one pass with real typeaheads, trending communities and live results ranked by an LLM — \"you don't have to take nine months to get that into prod to see if it works.\"\n\n**Why it works (first principles).** Static mocks hold a fixed, author-chosen slice, so they can't show how a *personalised* product behaves — design quality is a function of the data distribution each viewer sees (empty states, long titles, sparse vs dense feeds). A reviewer who sees *their own* data judges against lived experience instead of imagining it — swapping the cheap channel (an abstract mock) for the more informative one (the real thing for this viewer). The fidelity should match the *dimension the decision depends on*; if personalisation is the product, mock data fails exactly where the decision is made.\n\n**When & what it costs.** Ask which property the decision depends on (personalised data, scale, latency, state) and keep *that* real, however crude the visuals. (Unexamined risk: the episode never discusses privacy/access-control of running prototypes on production data.)\n\n---\n\n### 3. A cross-platform token/component \"Rosetta Stone\" exposed through an MCP\n_Hallucination here is a retrieval problem, not a reasoning one — a single source of truth turns \"which component is canonical?\" into a lookup._\n\n**The setup.** The team mapped design-system tokens and components (colours, type, button sizes) across Figma, iOS and prod code using Code Connect, into a visualisation (the \"Rosetta Stone\") that flags where values differ across platforms. It's exposed via a custom \"Proto MCP\" so generated code is \"prod-shaped.\" The map was refined by submitting PRs that did/didn't pass CI review, plus engineer feedback. The visualisation existed for visual verification that the harness *contains every part* — \"I know it's in there.\"\n\n**Why it works (first principles).** When an LLM writes UI code without a map, it must *infer* which of many near-identical components or hex values is canonical — and that inference is where hallucination appears, a *retrieval* problem more than reasoning. A single upstream source of truth, linked to every downstream representation, turns that inference into a lookup. Because each platform has its own copy of each token, *drift* between them is a real risk — surfacing discrepancies makes it visible. The try-fail-refine loop uses the *existing code-review process as an eval signal* on the MCP's quality, with no separate test suite. And you can't trust a context layer you can't inspect — the audit view is what made the layer trustworthy.\n\n**When & what it costs.** If generated code keeps missing conventions, check whether the model has a navigable *map* of them before blaming the model; make the context layer auditable; use your normal review pipeline as the feedback source. (The map must be maintained against prod; no pass-rate numbers given — PRs \"may or may not go through.\")\n\n---\n\n### 4. Location-addressed annotations: a pointer plus intent as the unit of edit request\n_The tool does the location lookup (deterministic); the person supplies the judgment (only they have it)._\n\n**The setup.** In the running prototype you click an element and write an annotation plus an \"overall direction\"; the harness writes a file with the code location, the annotation and the intent, and you tell Cursor \"apply annotations.\" Works \"with very little training\" against any surface or component.\n\n**Why it works (first principles).** Most of the cost of a vague \"change this\" is the agent working out *where* and *what*. Here the UI is instrumented so the *pointing gesture resolves to a code location automatically*, and the human supplies only what they actually know — what it should look like or do, plus the global goal. This splits the task cleanly: deterministic location lookup to the tool, judgment to the person. A *file hand-off* (rather than a live tool call) keeps a clean boundary between the prototype UI and the coding agent, so any IDE works. Generalises to any pointing-and-comment interface onto a generated artifact where the system can resolve the pointer to its source.\n\n**When & what it costs.** Reduce the prompt to what *only a human knows* and let instrumentation supply the rest; annotation-style edits suit precise local changes (the episode doesn't show large structural changes).\n\n---\n\n### 5. The PRD as a generated, context-carrying handoff (\"feature capsule\")\n_A handoff fails when the receiver lacks the sender's context — so derive the context-carrying artifact mechanically, and isolate the agent's writes._\n\n**The setup.** To go prototype→prod, you copy a Figma frame, run \"create from Figma\" through the Figma MCP, and the system maps the frame's components to what's known in prod, folds in earlier CI/engineer feedback, and generates a *PRD* with the user goal, acceptance criteria and Figma links. That PRD is sent to Cursor, which writes code in a *sibling repo* \"to keep prod clean\" and opens a draft PR. They tried \"the kitchen sink\" (many surfaces) but pulled back to \"high-fidelity UI.\" Figma (not the coded prototype) was judged the more accurate source.\n\n**Why it works (first principles).** A handoff fails when the receiver lacks the sender's context; the PRD is a *compression of intent* (goal, scope, acceptance) plus a pointer to the design source of truth — derived mechanically, so it *always exists*. The sibling repo is isolation by construction: the agent's mistakes can't touch prod, and the only path in is the normal PR/review gate. Narrowing scope to high-fidelity UI reflects a *reliability boundary* (the fully general version didn't work). Prototypes carry exploratory shortcuts and fake data, so they're a noisier spec than the design file — hence Figma as source.\n\n**When & what it costs.** Treat the handoff artifact as the interface between stages and *generate it automatically* so it isn't skipped; keep the agent's write target separate from the thing you must not break; expect generated PRs to need human review.\n\n---\n\n### 6. Public-by-default prototypes buy \"instant alignment\" but create a discovery problem\n_When creating artifacts gets cheap, creation outruns curation, so the bottleneck moves to search._\n\n**The setup.** Review happens with leadership *clicking through real prototypes* built from real design-system components, so nobody \"hangs up on a gotcha\" or \"rat-holes on a detail.\" Main benefit: \"instant alignment.\" All prototypes are internally public (~700 exist); \"that list doesn't scale,\" so they're building a searchable console (by person, area, tags, platform), with comments that can trigger new builds. Adoption: 100% of UX and product (~150 people). The best prototypers were \"great directors\" with \"huge context\" who aren't afraid to fail.\n\n**Why it works (first principles).** A reviewer rat-holes when the artifact looks unfinished or unfamiliar, because the *gap* between artifact and reality invites questions about the gap; a prototype built from real components removes the gap, so attention goes to the decision. Public-by-default turns every team's work into a visible shared pool (cheap overlap discovery), at the cost of private exploration space. The 700-count is the standard consequence of near-zero creation cost — *creation scales faster than curation*, so the bottleneck moves to search and selection.\n\n**When & what it costs.** When creating artifacts gets cheap, plan the *retrieval and curation* layer early. (The \"directors beat technical people\" claim is thin — a few named examples.)\n\n---\n\n## References\n- **Reddit Proto** (internal harness) and **Reddit Product Language (RPL)** (design system); **Cursor** (applies annotations, writes from the PRD); **Figma / Figma MCP / Code Connect** (design source + token map); **custom \"Proto MCP\"**; internal **Vercel-like deploy on Kubernetes**; **PWA/QR sharing**.\n- **\"Rosetta Stone\"** — the token/component mapping visualisation. **Prior How I AI episode on JSON-backed prototypes** — the contrast to live production data.\n\n## New concepts (learned today)\n- **Fidelity-matched prototyping** — keep real the property the decision depends on (live personalised data, real components, real state) instead of maximising visual polish; a personalised product on static mock data fails exactly where the judgment is made.\n- **Cross-platform token map as LLM grounding (design-system MCP)** — link each token/component across design tool, native and web code, expose it via an MCP, auto-flag cross-platform mismatches; turns \"which component is canonical?\" from inference into lookup, refined by CI/review outcomes.\n- **Location-addressed annotation** — an edit request = an instrumented pointer (UI element → source location) + a human comment + a global intent; the tool supplies *where*, the person supplies *what/why*, and a file hand-off keeps the UI separate from the agent.\n- **Sibling-repo write isolation** — have the agent write generated code into a separate repo copy and open a draft PR, so the normal review gate is the only route to prod.\n- **Curation bottleneck of public-by-default creation** — near-zero creation cost + full visibility means the count (~700) outgrows flat lists, moving the constraint to search/tagging.\n\n## Connections\n- The 700-prototype curation bottleneck is **bottleneck migration under cheap generation** made concrete — the same shift the Larson, Winters, Stanford and Doshi digests describe; cheap creation moves the constraint to review/selection.\n- The Rosetta-Stone MCP is **context engineering** (directly author what enters the model's context) and sits opposite **harness minimalism** — here the harness is deliberately *rich* (a curated tool map); sibling-repo isolation is the same guardrail as Serval's approved-toolkit and the Stanford \"auto-approvable class.\"\n- The try-fail-refine-against-CI loop is a weaker form of **back pressure / verifiable loop** — the checker is the review pipeline, not an automated pass/fail.\n\n## Left out\nSponsor reads, pleasantries, the playing-card side-project detail, and host recaps. No pass-rate or time-saved numbers are given beyond \"100% adoption of ~150 people\" and \"~700 prototypes,\" so the \"nine months\" and \"instant alignment\" claims are the speaker's assertion, not measured."

    "md": "# I tested 4 AI agents on 9 real tasks — here's what the method teaches\n_How I AI · deep-dive (a single-operator agent benchmark) · Read time: ~8 min_\n\n**Theme.** A non-blind head-to-head of four \"personal agents\" on nine real tasks. The *method and its confounds* teach more than the leaderboard, and the main finding is that fit depends on the task and on access, not on a general \"best model.\"\n\n---\n\n## The framework\n1. **Agent performance is a product, not a model property.** Outcome = model capability × access (connectors, repos, calendars) × skills/memory × output surface and permission style × latency. Most of the nine-task differences trace to the *non-model* terms.\n2. **A benchmark of real agent use must be built from real use and control its confounds.** The host equalises access, drives every agent with the same lightweight human-voiced prompts, and admits what's uncontrolled (memory, operator asymmetry, non-blind scoring) — treating the leaderboard as a weak signal and the per-task pattern as the real result.\n3. **Conclusion: route by task.** No single winner — work jobs to one agent, life jobs to another, coding to the underlying coding tools rather than their agent wrappers.\n\n---\n\n### 1. Build the task set from the agents' own self-reported usage\n**Says.** He asked each agent for its top-10 tasks for him, fed all four lists to Claude, and picked the tasks most common across agents — nine cross-cutting ones (Slack reply, short-form video cut, Sentry bug fix, thumbnail, inbox to-dos, family newspaper, physics explainer, shoe shopping, a launch video). Prompts were one line \"in my voice,\" not engineered.\n\n**Underneath.** A task set drawn from *actual usage* makes the benchmark's distribution match the user's real *value* distribution, so the score predicts utility rather than generic capability. Taking the *intersection* across agents reduces bias toward any one agent's strengths — but over-represents what's common, under-sampling tasks only one agent is used for. Short human-voiced prompts measure the agent's ability to *infer intent and use its own memory*, closer to real use but noisier.\n\n**So what.** Source evaluation tasks from observed behaviour; the sampling rule (union/intersection/weighted) shapes who wins; prompt style is a hidden variable — decide whether you're testing the agent or the prompter.\n\n### 2. Access parity is the dominant uncontrolled variable\n**Says.** He audited (via a browser-use agent) that all agents had roughly the same connectors — but forgot one agent had no Slack/GitHub and another had only a work calendar, so several \"failures\" were *missing access*. Completion-rate scoring (93% vs 79%) mixes capability with wiring; he \"gave a break\" on inaccessible tasks, so the headline percentages aren't like-for-like.\n\n**Underneath.** Task success is a *conjunction*: reach the data/action AND do the reasoning. Missing access zeroes the first factor regardless of model quality, so a failure observed *without an access audit* can't be attributed to capability — and completion-rate scoring conflates \"blocked\" with \"incapable.\"\n\n**So what.** Before comparing agents, treat connectors/accounts/skills as the experimental *control* and verify with a checklist; report failures as \"blocked by access\" vs \"attempted and failed\"; normalising the denominator changes the ranking.\n\n### 3. Orchestrating agents-driving-agents, and what it confounds\n**Says.** One operator agent used computer-use to drive the others and time the runs (an agent can't operate itself); he called one operator \"hot garbage,\" admits he babysat, didn't nudge consistently, and \"blind judging is fake\" — he judged live, then fed his spoken commentary to Claude to produce the final scores.\n\n**Underneath.** The *harness is part of the measurement*. Using different operators for different agents adds an *operator-quality confound* — one agent may have been penalised for its driver's flakiness. Non-blind scoring by a human with strong priors inflates agreement, and an LLM turning his spoken judgements into numbers adds no *independent* measurement. Each cell is n=1.\n\n**So what.** Treat such a benchmark as a structured, repeatable *vibe-check*, not a measurement; improve operator symmetry and blinding before task count.\n\n### 4. No universal winner; per-task rank inversion\n**Says.** Per-task winners flip — one agent won the Slack reply (it asked clarifying questions, \"knew me\") and bug fix; another won short-form video, the newspaper and the homework explainer (on speed); another won thumbnails, to-dos, shoes. The two coding-lab agents won on *code* but lost most other categories.\n\n**Underneath.** The *jagged, per-task capability profile* reappears at the agent level — agents are tuned/tooled for different surfaces, so the aggregate average hides large sign flips. A completion percentage compresses a profile into one scalar the host himself \"doesn't understand\"; a *task-level win matrix* carries the real information. The cleanest sign flip is coding: the coding-lab agents won code and lost elsewhere.\n\n**So what.** Pick/route by task type and don't average; be suspicious of one scalar leaderboard from a handful of tasks; check whether a winner's lead is concentrated in one or two tasks.\n\n### 5. Speed and permission style are first-class quality dimensions\n**Says.** The fastest agent won four of nine even though it needed the most steering; the slowest was the most permission-seeking (asked four times where others asked once — \"way too conservative\"). He liked a *sidebar that batches pending permission asks*.\n\n**Underneath.** Latency is a *cost on the human's attention* — a slow agent forces context-switching (\"I forgot what it was doing\"), so interaction speed changes which tasks are worth delegating at all. Permission frequency is the autonomy-friction trade-off: too few asks risk irreversible mistakes; too many make delegation pointless and teach users to click through. The sidebar *decouples asking from interrupting*, so confirmations are batched.\n\n**So what.** Evaluate agents on time-to-useful-result and interruption count, not just final-output quality; a batched, non-blocking permission surface may beat either always-ask or never-ask.\n\n### 6. The output surface decides the result as much as the content\n**Says.** All agents found the to-dos, but one won because it produced a *nice checklist document*; another put them in its own app list (requiring you to be in its app); a third sent a five-item message and got a thumbs-down. When one agent lacked access, it returned a *markdown outline of how to do the job* instead of doing it. Another, lacking repo access, *fabricated* product content (\"bad in an ambitious way\").\n\n**Underneath.** Equivalent information in different containers has different *usability* — structure, checkability, and whether it lands where the user already works. The markdown-instructions fallback converts \"I can't act\" into \"here's advice,\" *hiding the failure* from the agent's completion metric while handing work back to the human. Blocked agents split into three behaviours — refuse, hand back instructions, hallucinate — each with different downstream risk.\n\n**So what.** When scoring, record *how* an agent fails under missing capability, not only whether it succeeds; prefer agents that say \"blocked\" clearly; judge the artifact in the form the user actually consumes.\n\n### 7. Grading code fixes beyond \"tests pass\"\n**Says.** The coding-lab agent's fix was closest to the real one; another found a second bug the team missed *and* recognised the first agent had already fixed the main one (so shipped no extra code); a third \"loosened validation\" to make the error go away.\n\n**Underneath.** *Loosening validation* removes the symptom by weakening the invariant — specification gaming on the visible error signal. Recognising prior work and declining to ship redundant changes is a different capability (*state-awareness across parallel agents*) that matters once several agents touch one repo. Using an LLM to grade other LLMs' fixes shares the *correlated-grader* risk.\n\n**So what.** Grade fixes on whether they address cause and preserve invariants, not only on whether the error disappears; reward not re-doing finished work.\n\n### 8. The agent ≠ the underlying tool: the wrapper isn't the capability\n**Says.** The coding winners were the two coding-lab agents, but \"I would not use those *agents* to code\" — he'd use the underlying tools (Codex, Claude Code). The strong model labs \"are losing the personal-agent category\" while \"two agents race for my coding workflows.\"\n\n**Underneath.** The same model delivers different value through different *harnesses* (which determine tools, context, interface, permissions). Capability in a coding-specialised tool doesn't transfer to a general personal agent from the same lab, and vice versa — a strong model lab can *lose a wrapper category* to labs with better-fitted surfaces.\n\n**So what.** Don't infer an agent product's quality from its parent lab's model reputation; don't assume winning in one harness predicts winning in another.\n\n---\n\n## References\n- The four agents (names inferred from a garbled transcript): **OpenAI/Codex-based** (best at code, weak creative; also the operator driving others), **Anthropic's** (slowest, most permission-asking, best launch video + most complete bug fix), **xAI/Grok** (overall \"winner,\" best at Figma/shopping/docs, weak at coding), and the host's **personal \"Muse\"** (fast, personal jobs; lacked Slack/GitHub).\n- **Codex** (favourite computer-use operator; audited connectors via browser-use); **Opus 5.5** (graded bug fixes + compiled scores); **Sentry, Linear, Devin, Figma MCP, ChatPRD, ElevenLabs MCP** — task tooling. Phrase \"fast beats right\" — his earlier heuristic, now qualified.\n\n## New concepts (learned today)\n- **Access-parity control (agent benchmarking)** — audit that each agent has the same connectors/skills/permissions before comparing, because a missing connector zeroes task success regardless of model quality.\n- **Failure-mode taxonomy under missing capability** — a blocked agent tends to refuse/flag, hand back advice in place of action (looks like completion), or fabricate; record *how* it fails, not only whether.\n- **Symptom-suppression fix (validation loosening)** — a code fix that makes an error disappear by weakening the check that raised it; specification gaming a grader should catch.\n- **Operator-asymmetry confound** — in agents-driving-agents benchmarks, different operator agents mix operator reliability into the candidate's score; use a single operator.\n- **Output-surface affordance** — the container of a result (structured doc, chat message, locked-in app list, markdown) changes the practical value of identical content.\n\n## Connections\n- The jagged per-task profile is **jagged frontier** at the agent-product level; the \"agent ≠ underlying tool\" point is the **inner/outer harness** idea — the harness carries a large share of the value (cf. the GitHub-growth \"context is the moat\" and Stanford \"harness tracks model weakness\" digests).\n- Non-blind + LLM-compiled scoring is the **self-check illusion** (correlated verification); the batched permission sidebar is an answer to the **autonomy-deference / reversibility-calibrated autonomy** axis.\n\n## Left out\nSponsor reads, the video-playback transcript, cheerful personal asides, and the repeated \"Grok is best\" cheering. Specific scores beyond the two headline completion rates are dropped, since the host says he doesn't know how they were computed. Treat the whole run as a hypothesis generator: n=1 per cell, unblinded, unequal access."

    "md": "# The AI chief of staff a Figma PM uses all day\n_How I AI · Ezra (Figma growth PM) with Claire Vo · deep-dive (one PM's agent workflow) · Read time: ~9 min_\n\n**Theme.** A tour of one PM's agent-based workflow: a shared repo of skills, an experiment-running agent loop, an agent that runs bug bashes, and a very fast small model as an always-on checker. The recurring question is where agents beat humans (tedious, exhaustive, perishable-opportunity work) and where the one human touch should go.\n\n---\n\n### 1. Floor-raising delegation, with org context as the shared substrate (PMOS)\n_Automate the jobs you do badly or skip — the value is the gap between \"not done\" and \"done adequately,\" which is large and cheap to close._\n\n**The setup.** Ezra's goal is \"to be lazy in the right places\" — automate the jobs he does badly or skips, at \"the minimum allowable level of missing things\" (looping in support on launches, meeting notes, finding who owns what in a ~2,000-person company). **PMOS** is a plain repo: an agents.md, ~31 skills with trigger conditions, and boot hooks (including a version check so 60–70 PMs stay in sync). Each user's workspace is a private sub-repo under a read-only parent. It grew from a 3-person Slack channel firing PRs (\"a Cambrian explosion of a thousand skills\"), then got pruned at an offsite. He deliberately kept no usage telemetry (felt creepy); feedback came from a public channel.\n\n**How it works.** Two things are bundled. (1) *Delegation target*: automating your weakest jobs lifts the baseline without competing with your best work — \"raise the floor and remove the ceiling\" are separate levers. (2) *What a skill encodes*: the model already knows how to write a doc; it doesn't know your org's topology — who the designer/EM is, which channels matter, what \"a good job\" means this week. A skill is a *store for local, non-derivable context*. The distribution design (immutable parent + private child) separates \"shared and versioned\" from \"personal and writable,\" and an auto-update hook fixes fleet drift.\n\n**Why it works (first principles).** Generic procedural scaffolding gets absorbed by better models; *local context* does not — which is why Ezra *prunes* skills as models improve (parts are \"over-specified\" now). A skill library is a *liability register*: each entry should carry either org-specific knowledge or a model weakness, and be deleted once the model catches up. The discovery process (a burst of divergent contributions, then collective whittling) is a generate-then-select pattern that substitutes for telemetry.\n\n**When & what it costs.** Ask of any candidate automation whether it closes a not-done→adequate gap or only polishes a strength. A shared agent config needs a version signal and a clean shared/private split, or fleets drift. Soft social feedback stands in for instrumentation, at the cost of being anecdotal and vocal-user-biased.\n\n---\n\n### 2. The attention router (\"What's Up\"): encode a definition of a good day\n_Reading is now free; the scarce resource is the prioritisation function — what counts as important to *this person in this role*._\n\n**The setup.** Ezra runs a \"what's up\" skill ~6×/day: it reads curated Slack channels in full, surfacing who he owes things to, which decisions are outstanding, and the state of his live experiments. He archives ~10 channels/day. The skill is \"tuned to how you judge whether you're doing a good job\" — and he concedes it's probably over-specified now.\n\n**Why it works (first principles).** Raw summarisation of everything just produces the same overload in a smaller form. The skill's real content is the *prioritisation function* (what's important to him) plus a curated source list — putting \"how I judge myself\" into the instructions turns a summariser into a *triage layer*. The caveat: a fixed scoring spec is a model of your priorities *at one moment*, so it goes stale and must be revisited.\n\n**When & what it costs.** Specify the output as a *judgement* (\"what should I act on, and why\"), not a digest; include your role's evaluation criteria and an explicit source allow-list; re-read and delete rules the model now infers on its own.\n\n---\n\n### 3. AutoXP: traffic as a perishable resource, and a single pre-exposure human gate\n_Experiment throughput is limited by human attention per experiment, not by traffic — and unused traffic can't be banked._\n\n**The setup.** \"As a growth PM, the biggest sin is wasting traffic.\" AutoXP is three Cursor automations triggered by Slack: a data-scientist agent looks at funnel drop-off/mix-shift, a UX-writing agent proposes copy, an engineer agent opens and runs a PR — each writing back to the same Slack thread (the shared log). When an experiment finishes, a webhook triggers analysis against encoded explore/exploit + win/loss rules. The human only looks *before launch*, reviewing hypotheses, data findings, copy and code in one pass, and the loop is already iterating by the time they see a result. One engineer runs ~5 concurrent experiments the PM hasn't reviewed.\n\n**Why it works (first principles).** Experiment throughput is limited by the *human attention per experiment* (ideation, analysis, spec, review), not traffic — and unallocated traffic is a *perishable resource* with a real opportunity cost. If the marginal cost of an experiment drops, surfaces never worth a human's time become positive expected value, so the *experiment surface expands*. A bad experiment only causes harm once it reaches users, so *one consolidated review before exposure* is the correct point to concentrate oversight; everything after launch is measured by statistics and is safe to automate. Chaining specialist agents through a shared thread keeps the causal chain auditable.\n\n**When & what it costs.** Put the human gate at the irreversible boundary (exposure to real users), batch the review into one artifact, and automate monitoring/closing-the-loop on either side. (Caveats he skips: many parallel experiments risk interaction effects and multiple-comparison false positives; the explore/exploit rules are only as good as the PM's past judgment.)\n\n---\n\n### 4. Agent bug-bashing: tireless exhaustive path-following beats human diligence\n_The cost of the 500th test scenario is the same as the first — which is exactly where salience-based human QA fails._\n\n**The setup.** A persistent Codex thread runs bug bashes from FigJam files (test accounts, paths, actions, things to watch for), using a human account and an agent account, writing results back to the FigJam. Last month it found two bugs: a text box broke with a thousand emojis; a seat-request flow showed \"a\" vs \"an\" depending on whether the team name starts with a vowel. \"Much more diligent about following directions than I am.\" Remaining work: tuning so its comments aren't noisy.\n\n**Why it works (first principles).** Manual QA is limited by *boredom and sampling* — people test the paths they find salient and stop when it *feels* done. The seat-request bug depended on a *field value* (the team name's first letter), so it appeared only for specific data; finding it requires systematically varying inputs, which is tedious for humans and cheap for an agent. A checklist of paths/accounts/observations turns an open-ended judgement (\"is this good?\") into a *closed enumeration plus observation*. Browser use lets the agent exercise the actual product as a real user. Cost: false positives — a tiresome reviewer is a bad reviewer, so precision tuning is real work.\n\n**When & what it costs.** Convert test plans into explicit enumerable scripts (account, path, actions, expected observations); aim the agent hardest at *input-/data-dependent edge cases* human sampling misses; tune precision, because noise erodes trust.\n\n---\n\n### 5. A fast, cheap scalar model as an ambient check on every pause\n_Latency and cost, not only quality, decide what an AI can be as an interaction primitive._\n\n**The setup.** Ezra builds a prototype writing editor on a very fast, cheap model that returns essentially a number or boolean (\"rate this 1–10,\" \"true/false\"). Each time the writer stops typing, it fires a check for a placeholder (\"TK\") or an unsupported claim (\"we spoke with x writers…\"), then retrieves matching interview quotes from the user's library. The motivating problem: top-tier agents on the canvas \"don't feel like a coworker\" because they're slow.\n\n**Why it works (first principles).** Latency and cost set what an AI can be used *for*. A model that takes seconds and costs real money is something you invoke *deliberately*; one that returns in tens of milliseconds for fractions of a cent can sit *under every pause* as ambient infrastructure, like a spell-checker but for semantic properties. Restricting output to a *scalar or label* is what makes this feasible — classification is far cheaper than generation, easy to threshold, and fails in a bounded way. The pause is the right trigger because it marks the user's intent boundary, so checks don't interrupt flow. Generalises to any task needing many cheap judgments (drift checks, gating, routing, relevance scoring) in front of a slower, smarter step.\n\n**When & what it costs.** Decide which judgments need a deliberate smart call and which can be *ambient checks on a cheap model*; frame the latter as scalar/boolean questions; trigger on idle/pause events, not polling. (Demo showed a capability, not accuracy data.)\n\n---\n\n## References\n- **Claude Code / Codex / Cursor automations / FigJam MCP** — the tool stack (Codex now near-full-time, partly for browser use).\n- **Zapier** — Ezra's earlier over-automation habit. **Yuki (Figma CPO)** — the \"get all PMs AI-pilled\" challenge that led to PMOS. **Marianne** — engineer driving AutoXP.\n- **Experiment Engine (Claire's earlier startup)** — same hypothesis as AutoXP. **\"Raise the floor, take off the ceiling\"** (Claire's framing). **Instinct / Muse / Grok** — personal agents (not core).\n\n## New concepts (learned today)\n- **Floor-raising delegation** — pick automation targets by the not-done→adequate gap (jobs you skip or do poorly), not by polishing strengths.\n- **Skill as local-context store (and skill decay)** — a skill is valuable mainly for what the model *can't derive* (org topology, your definition of good); generic procedure gets absorbed, so the library needs pruning.\n- **Perishable-traffic experiment throughput** — unallocated experiment traffic can't be banked, so volume is limited by human attention per experiment; cutting that cost expands the surface worth testing.\n- **Single pre-exposure human gate** — concentrate human review in one consolidated checkpoint before changes reach real users; automate monitoring/analysis on either side.\n- **Data-dependent edge-case diligence** — agents beat human QA on *tireless enumeration*; bugs triggered by specific field values are missed by salience-based sampling.\n- **Ambient scalar checker** — a very fast, cheap model constrained to a number/boolean can run on every idle pause as infrastructure; latency and cost, not only quality, decide which tasks a model suits.\n\n## Connections\n- \"Skill as local-context store / prune as models improve\" is the same insight as the **Stanford AI-native** (scaffold-to-weights migration) and **Tulsee Doshi** (\"the model eats your harness\") digests this run.\n- The single pre-exposure human gate is **verification-as-accountability** placed at *user exposure*; the ambient scalar checker is the **judge-distillation / latency-cost-quality** idea — cheap fast judges unlock uses a general model can't serve.\n- Agent bug-bashing reuses **browser-use as an integration surface**.\n\n## Left out\nSponsor reads, the lightning round (Instinct/Grok/Muse, the basilisk joke), and the hiring pitch. \"Restart a poisoned thread\" is already in the ledger as trajectory/agentic-context."

    "md": "# Why PhonePe still bets on data centres\n_Hasgeek TV · PhonePe infra/SRE panel · deep-dive (own-the-stack economics for payments) · Read time: ~9 min_\n\n**Theme.** Owning the whole stack was a deliberate day-zero bet for a payments company — and that one bet shapes capacity planning, networking, security, and the kind of engineers they hire. (~350M transactions/day on ~30,000 servers.)\n\n---\n\n### 1. Ratcheting load makes elasticity worth little\n_The value of renting capacity is proportional to how much load reverts after a peak — and payments load steps up and stays._\n\n**The setup.** Their spikes are mostly IPL. Traffic jumps and \"this becomes my BAU for the rest of the year,\" settling at maybe 1.1–1.2×, not back to 1×. Contrast retail sale days: stateless browse traffic that spins up and down. Payments data goes *into* the database and \"is not coming back out.\"\n\n**Why it works (first principles).** Elasticity is worth something only to the extent demand *reverts*. The value of renting by the hour is roughly the area between peak and average — the capacity you avoid paying for. A load curve that steps up and stays has almost no area to harvest. Two causes of the ratchet: user growth is monotonic once a habit forms; and a transactional system has *state that only accumulates*, so storage/DB capacity is a one-way valve regardless of traffic shape. Stateless compute scales down; stateful systems can't. So \"cloud vs own\" is really about the *shape of the demand curve* (variance, reversion, statefulness), not company size or ideology. Rented capacity is a premium paid for the right to shrink — and if you never exercise that right, you pay the premium for nothing.\n\n**When & what it costs.** Before rent-vs-own, characterise the load: how much of the peak reverts, how much of the footprint is state that never shrinks. Stateless-bursty and stateful-ratcheting workloads belong in different cost regimes even inside one company.\n\n---\n\n### 2. Owning means paying for the forecast up front — and the real cost is *people*\n_A cloud absorbs forecast error by letting you buy at the moment of need; owned hardware converts forecast error into either idle money or an outage._\n\n**The setup.** Server lead time is 2–3 months. They plan to 1.5× of today's peak and have procurement for half of next year already planned: \"if you expect 2×, I already have the infra in place, I power it up.\" On CapEx: \"the largest investment has been in building out that team — you can't throw money at the problem.\" They design vendor-agnostic on open standards, which let them keep scaling through COVID supply shortages.\n\n**Why it works (first principles).** Capacity has a lead time, so the skill shifts from *reacting* to demand to *forecasting* it with a safety margin — the 1.5× headroom is a hedge sized to forecast error over a ~3-month horizon plus a known spike shape. The deeper point: a cloud sells *integration labour* as well as compute. Own, and you become the integrator of power, cooling, cabling, spares, switches, OS images. Hardware is the visible cost; the hidden fixed cost is a team skilled enough to run all of it — \"building your own cloud can't be a part-time job.\" Owning also *moves* lock-in rather than removing it: you escape cloud-vendor lock-in but take on hardware-vendor and supply-chain lock-in, so substitutability must be *designed in* (open protocols, a standard OS image).\n\n**When & what it costs.** Compare rent vs own on forecast error, lead time, the fixed cost of the operating team, and supplier fungibility — not sticker price per core. Owning pays off only if the team cost amortises across enough scale.\n\n---\n\n### 3. Move the irreversible decisions to day zero, so growth becomes an operational task\n_Spend rigor where being wrong later is costly to undo; stay lazy everywhere else._\n\n**The setup.** Databases were sharded \"on day zero\" at ~1,000 RPS, so scaling is \"just add more shards / more containers — more from an operational point of view.\" The new data centre went straight to 10/25G links when the old one ran 1G at ~50% utilisation — a bare minimum that bought 10–20× of growth. They admit it \"slowed us down a bit… added complexity where it was not needed\" — but the team had seen the pain at earlier employers.\n\n**Why it works (first principles).** Systems differ in how costly each decision is to *reverse*. Stateless replicas are trivially horizontal; the data partitioning scheme and the physical network fabric are not — changing either later means migrating live state or recabling under load. Pre-paying complexity on the few load-bearing, hard-to-reverse axes (partition key, link speed, topology) converts later scaling from an *engineering project* (redesign) into a *procurement-and-automation task* (add units). The cost is real — early over-engineering carried as drag before scale arrives — so the bet only wins if scale does arrive (survivorship is baked in). The general rule: front-load design effort where the cost of being wrong later is highest, stay cheap elsewhere.\n\n**When & what it costs.** Separate decisions into reversible and irreversible; ask whether a given growth step needs redesign or only more of the same unit. Works when you have strong conviction about the destination; expensive otherwise.\n\n---\n\n### 4. Load-balance by routing, not by a box (anycast + ECMP over BGP)\n_Reuse an already-scaled, already-redundant substrate for a function that usually gets its own appliance._\n\n**The setup.** They run a fully BGP network *inside* the data centre (\"something you typically run in internet IP space\") and load-balance \"without a load balancer\": servers able to handle traffic advertise the same anycast IP and take it up.\n\n**Why it works (first principles).** A traditional load balancer is a stateful chokepoint — all traffic passes through it, and it can fail or saturate. In anycast, many servers announce the same virtual IP into the routing fabric; switches see several equal-cost next hops and spread flows across them via ECMP hashing on the flow tuple (keeping one connection on one server). Distribution moves from a dedicated device into the *forwarding plane every switch already runs at line rate*. Health handling reuses routing too: an unhealthy server withdraws its announcement and the fabric stops sending to it. Capacity then scales with the number of announcing servers and the fabric's bandwidth — no per-box throughput ceiling. Costs: coarser, hash-based (not load-aware) balancing, hash reshuffling when membership changes, and the need for engineers who treat routing as application infrastructure.\n\n**When & what it costs.** Ask whether a function with its own dedicated component could be expressed in a layer that already scales and is already redundant. You gain data-path scale/simplicity; you lose fine-grained, load-aware steering.\n\n---\n\n### 5. Ownership makes the control surface fine enough to pass audits; standardisation shrinks the attack surface\n_Security posture follows from which layers you control._\n\n**The setup.** \"Zero trust. I don't even trust myself.\" Line-rate encryption on inter-DC links; hosts talk only to whitelisted peers with VPC-like segmentation \"much tighter and finer\"; no system has open internet access; egress only to whitelisted sites; SSH via short-lived, scoped certificates. They undergo \"north of 50 audits a year\" — \"every week a new auditor.\" They narrowed to a single certified OS baseline despite wanting choice, so there's less to patch.\n\n**Why it works (first principles).** Three distinct mechanisms. (1) *Granularity of control*: owning network, host and identity layers lets you set policy finer than a vendor's abstraction exposes — the real argument for owning in a regulated domain, since regulators want guarantees your abstraction layer may not surface. (2) *Time-bounded, scoped privilege*: a certificate that expires and covers one host-set replaces a standing credential with a capability whose damage window and blast radius are both bounded by construction. (3) *Variety reduction*: every extra OS/package/vendor option multiplies the patch and misconfiguration surface, so constraining choice trades flexibility for a smaller thing to defend. The 50+ rotating audits act as a standing adversarial test — each auditor brings different requirements, forcing the design to stay *defensible*, not just compliant-once.\n\n**When & what it costs.** Prefer capabilities that *expire* over standing access; deliberately cut optionality in the stack you must patch; treat frequent external scrutiny as a design input. Cost: a large bespoke tooling burden that only pays at scale.\n\n---\n\n### 6. At scale, rare bugs are certain — so specialisation boundaries become the failure mode\n_Rare-event frequency is probability × volume; at huge volume a one-in-a-million condition fires routinely._\n\n**The setup.** \"There is no corner case we have not seen happen.\" A bug reported once, three years ago, by one person in one forum — never fixed — hit them \"at the worst possible time.\" No separate DBA or systems on-call: everyone's in rotation, expected to know ~90% of what's needed to run production (hyperthreading on/off per workload is their cross-layer example). Monitoring is *decentralised* (split by data store, visualisation, business unit) because if one observability tool fails, \"you're flying blind.\" No stock tool handles 30,000 servers unchanged.\n\n**Why it works (first principles).** At large volume you hit the long tail of every dependency, including undocumented ones — and root causes often sit in a layer the symptom's owner doesn't own (a slow DB may be a network or CPU-topology issue). A rotation split *by technology* puts a handoff in the middle of diagnosis; organising teams around a *business outcome* forces people to follow the cause across layers (which is why depth in a single stack \"is not good enough,\" and hiring weights fundamentals and learning ability). The same logic applies to tooling: observability is itself a dependency and a *correlated* failure source, so centralising it creates a single failure mode that blinds you exactly during an incident — decentralising bounds that blast radius.\n\n**When & what it costs.** When failures cross layers, team boundaries aligned to layers lengthen diagnosis. Treat the monitoring/control plane as a system whose independent failure you must plan for, and expect off-the-shelf tooling to hit its limits at the extreme.\n\n---\n\n## New concepts (learned today)\n- **Demand ratchet (elasticity value vs load shape)** — renting elastic capacity is worth only as much as load reverts after a peak; traffic that steps up and stays, plus state that only accumulates, leaves little reversion to monetise, so rent-vs-own turns on load shape and statefulness, not company size.\n- **Anycast + ECMP load balancing (LB-less routing)** — many servers advertise the same virtual IP over BGP; the fabric spreads flows across equal-cost next hops by flow hash; unhealthy servers withdraw their route. Removes the LB chokepoint at the cost of load-unaware, hash-based distribution.\n- **Irreversibility-first design** — spend design effort up front only on decisions costly to reverse under load (partition key, fabric speed/topology), making later growth an \"add units\" task; costs early complexity and only wins if scale arrives.\n- **Elasticity as forecast-hedging (owned capacity)** — owning swaps pay-at-need elasticity for a forecast + headroom (e.g. 1.5× of peak against 2–3-month lead time); forecast error becomes idle capital or an outage.\n- **Time-bounded scoped credentials (cert-based SSH)** — access as an expiring certificate valid only for a defined host-set, so blast radius and time window are bounded by construction.\n- **Variety reduction as security (certified baseline OS)** — fewer OS/package/vendor options shrink the patch and misconfig surface, trading flexibility for defensibility.\n- **Observability-plane blast-radius decentralisation** — split monitoring by data store, visualisation layer and business unit so no single tool failure removes all visibility during an incident.\n\n## Connections\n- The mirror image of the **Flipkart** digest this run: Flipkart *rents the spike* because sale-day load is bursty and reverts; PhonePe *owns* because payments load ratchets up and is stateful. Same first principle (elasticity is worth only the reversion you harvest), opposite conclusions from opposite load shapes.\n- Irreversibility-first design (3) is the costed, stateful-systems version of **derive-from-the-end-state** — the same habit as IRCTC's freeze-then-assign and FOSS-Postgres's design-for-disposal.\n- Decentralised monitoring (6) is the infra form of the **correlated-verification / self-check illusion**: a single shared checker fails together with the thing it checks.\n\n## Left out\nCompetitor banter, the \"shit happens\" and \"identify before you solve\" closing platitudes, the generic AI-adoption answer, and the scale-journey number recitation. (The title's \"when the cloud wins\" half is barely covered — the only cloud-side point is the spike-and-scale-down overhead above.)"

    "md": "# Scaling Hotstar for 25 million concurrent viewers\n_Hasgeek TV · deep-dive (live-video platform engineering) · Read time: ~9 min_\n\n**Theme.** At record concurrency the hard problem isn't \"serve a lot of traffic\" — it's that the traffic *changes faster than infrastructure can react*. Everything below follows from that one fact: you plan from demand you can predict, you test to the breaking point on purpose, and you decide in advance what you'll throw overboard when the ship is sinking.\n\n---\n\n### 1. Scale ahead of demand, not in reaction to it\n_If the fire spreads faster than the truck arrives, you can't fight it by watching for smoke — you pre-position the truck._\n\n**The setup.** During a match, viewers arrived at ~1 million per minute; one push notification took the platform from 13M to 25M concurrent in ten minutes. Spinning up a new server and getting it ready to take traffic takes 5–6 minutes. So by the time any \"we're busy, add servers\" signal fires, the surge it was reacting to is already over — or has already toppled you.\n\n**How it works.** Build up from the problem. If you can't react in time, you must *act before the signal* — which means you need something that tells you load is coming before it lands. Hotstar's tell is **platform-wide concurrency** (how many people are watching right now), a number that exists *upstream* of any single service feeling the heat. They pre-measured, offline, how many servers each service needs at each concurrency level — a lookup table, a \"ladder\": *at N viewers, the playback service needs M servers*. A custom scaler reads concurrency and provisions up the ladder early, with a safety buffer. Notice what they refuse to scale on: **CPU**. High CPU isn't the thing you actually care about — a box at 70% CPU with flat latency is hurting no one — and it only rises *after* the load is already on the box, i.e. too late.\n\n**Why it works (first principles).** This is the difference between **feedback** and **feedforward** control. Feedback = watch the output, correct when it drifts; it only works when the system responds faster than the disturbance changes. Here the response lag (6 minutes) is longer than the time demand needs to move by millions, so feedback is structurally doomed — no amount of threshold-tuning saves it. Feedforward = predict the disturbance from a *leading indicator* and act before the effect shows up. Concurrency is a better trigger than CPU on two counts: it's *leading* (known before any box feels it) and it's *closer to the real cause* (users), whereas CPU is a *lagging proxy* for the thing you actually defend — user-visible latency. The ladder is just a pre-computed function from the one thing you can forecast (viewers) to the thing you must provision (servers).\n\n**When & what it costs.** You need (a) a forecastable upstream signal and (b) the discipline to benchmark each component's capacity offline. It breaks where load has no leading indicator. Bonus predictors are free when the event is scheduled — an innings break or a timeout *is* advance notice of a surge.\n\n---\n\n### 2. \"Elastic\" cloud has hard walls — you just can't see them until you're big enough to be a meaningful fraction of the pool\n_Elastic means \"stretches,\" not \"infinite.\" At your scale you're a rounding error in the provider's pool; at Hotstar's, you're a visible chunk of it, and the abstraction leaks._\n\n**The setup.** The off-the-shelf autoscaler failed four ways at once: you ask for 200 servers and get 50 (the capacity just isn't there that second); a scaling group is pinned to one instance type, so if that type is sold out you're stuck; raising servers in small steps makes a 100→800 jump take 10–15 minutes, but raising the step size floods fixed *control-plane* API limits (the calls to launch, attach to load balancer, mount disks); and launching evenly across zones means a zone that's out of capacity gets retried with exponential backoff, dragging a scale-up from 5 to 25 minutes.\n\n**How it works.** Every fix is the same three moves. **Diversify** across things that are substitutes — many instance types, many zones (spot fleets let you accept \"any of these dozens of machines\"), a backup scaling group on a different instance type triggered when the primary reports a shortage. **Pre-bake** anything you'd otherwise do at launch — fully built machine images and containers with no config-fetching at boot, because boot-time work is latency you pay at the worst possible moment. **Shard** anything with a per-unit ceiling and spread load across the shards — e.g. 4–5 load balancers per application behind weighted routing, because a single \"elastic\" load balancer has its own hidden cap.\n\n**Why it works (first principles).** Any shared resource sold as \"elastic\" is elastic only *within quotas, pooled supply, and rate limits*. Those limits are invisible at small scale because you never approach them. The general law: **the abstraction of infinite supply holds only while you're small relative to the supplier.** Diversification is portfolio logic applied to supply risk — don't let one exhausted resource be fatal. And a retry policy that's correct for one request (back off, try later) becomes *harmful* when it blocks an aggregate goal — the zone that keeps getting retried starves the whole scale-up. Fixing one ceiling by pushing harder usually just relocates the load onto the next shared ceiling (bigger steps → control-plane API limit).\n\n**When & what it costs.** This only becomes your problem past a scale threshold; below it, \"the cloud handles it\" is fine. The cost is real complexity — multi-type, multi-zone, multi-LB orchestration — that you should *not* pay until you can measure yourself bumping the walls.\n\n---\n\n### 3. The dangerous moment is the crash, not the peak\n_Capacity planning that watches only the headline number misses that the same number of people can suddenly cost ten times as much._\n\n**The setup.** While the match plays, viewers mostly stream video — few API calls per person. When a wicket falls, millions hit \"back,\" land on the home page, and that page fires many expensive personalised calls (continue-watching, recommendations, the masthead). So a *drop* from 25M to fewer can hammer the backend harder than the peak did. In the speaker's words, the drop \"is what kills most of the platform.\" The same shape appears when a CDN edge node fails and all its traffic falls back onto the origin at once.\n\n**How it works.** You stop planning around a single concurrency number and start planning around **state transitions** — surge, drop, edge-failure. The tiers that *can't* scale on the fly (caches, the relational database) are sized to the worst transition, not the average, because they're the hard floor everything else stands on.\n\n**Why it works (first principles).** Load on any service = concurrency × *the per-user request profile* × fan-out beneath it. The headline number is only the first term. What a user is *doing* sets the second term, and that can shift violently while the first term holds steady or even falls. Two deeper laws: (1) a layer that *absorbs* load (a CDN edge, a cache) also *hides* the true demand underneath it — until it fails, at which point the full hidden demand arrives instantly; (2) tail risk at scale lives in **correlated transitions** — everyone doing the same thing at the same instant — because independence is exactly the assumption that lets averages stay calm. A synchronised audience breaks that assumption.\n\n**When & what it costs.** Wherever demand is correlated (live events, flash sales, anything event-driven). The cost is that your non-elastic tiers must be provisioned for a worst-case moment that may last seconds — you pay for peak capacity you use rarely, because the alternative is collapse at the one moment that matters.\n\n---\n\n### 4. You can only plan capacity if you've mapped the user journey\n_The journey is the translator between the one number you can forecast (viewers) and the dozens you can't (load on each service)._\n\n**The setup.** If you know the exact API calls behind \"open the app,\" \"tap home,\" and \"press play,\" you can script them, measure where each service breaks (its rated requests-per-second), and replay a synthetic version of the whole traffic curve. Each service has its own ratio at each moment — video APIs run hot during play, payments and personalisation run cold. Hotstar generates this load from ~3,000 large machines across eight regions, deliberately spread so the *test itself* doesn't overwhelm shared cloud edge locations. They tested \"tsunami\" shapes (surge then drop) and ML-assisted what-ifs (\"India batting first\"), and planned for 50M against an actual 25M peak.\n\n**How it works.** The journey-to-calls map is the core planning artifact. From it: capacity per service = viewers × calls-per-user-per-step × the mix of steps over time. Derive the per-service ratios from real logs, not guesses.\n\n**Why it works (first principles).** Without the journey map, every service owner is guessing at their slice of a number they can't connect to their own load. The map is the *model* that links the forecastable input to all the unobservable outputs. A subtle second point: a load test run from one place hits shared infrastructure and can become an outage of its own — so the generators are geo-distributed to look like real demand. Planning for 2× the expected peak is a deliberate margin against model error and unknown-unknowns, not over-caution.\n\n**When & what it costs.** Any system where you can enumerate the user's paths. Costs: real instrumentation to derive the ratios, and a load-generation fleet big and distributed enough to be realistic without self-inflicting damage.\n\n---\n\n### 5. Decide what you'll sacrifice *before* you're forced to\n_Under overload you either degrade everything at random, or you degrade chosen things on purpose. Only the second is a strategy._\n\n**The setup.** Services are ranked by criticality: P0 = video, ads, subscription, payments. Personalisation and recommendations are declared droppable for ~30 minutes during peak moments — 25M viewers are ~99.99% of traffic and they're here to watch, not to get recommendations. The team watches each service's live \"% of rated capacity\" and manually flips ones nearing 80–90% into **panic mode**: the panicked service returns an *OK-shaped* (200) response instead of an error, so nothing upstream sees a failure and starts retrying. The client understands a custom code, so if login or payments break on the backend, the user is *let through to watch* until it's fixed.\n\n**How it works.** Rank functions ahead of time; give each non-critical dependency a defined \"off\" behaviour; and for each one decide, in advance, whether it should **fail open** (let the user through) or **fail closed** (block). Give the client a distinct signal for \"known server-side problem\" so it doesn't render the user's experience as *their* error.\n\n**Why it works (first principles).** This is **load-shedding by priority**, and it only pays off because value is wildly unevenly distributed across the traffic — almost everyone wants the one P0 thing. Returning a benign response matters because **errors propagate**: a visible failure triggers retries and error UIs that turn one local fault into a global storm; a failure disguised as success stops the cascade. The fail-open choice for auth/payment is really a business decision in engineering clothing: when the cost of wrongly admitting a user (one free stream) is tiny next to the cost of wrongly rejecting millions, the *safe direction to fail* is open — valid only because that failure cost is asymmetric and bounded.\n\n**When & what it costs.** Works when (a) value is concentrated in a few functions and (b) you can enumerate failure behaviours in advance. The cost is upfront design per dependency and an honest classification of what's truly P0 — and the discipline to write down *why* each thing fails the way it does.\n\n---\n\n### 6. Find your limits on purpose, at load\n_A fault that's harmless at 10M can be fatal at 25M — so you can't learn your real failure modes except by breaking things while they're under real load._\n\n**The setup.** Game days and scripted failures (drop an availability zone, kill 30% of compute, delete a network route) are run deliberately to find choke points — mostly in the non-elastic data stores. Chaos here is two things: replaying past failures at *different load levels*, and random untargeted breakage. It's homegrown. The prep took ~2 years, with no one at that scale to copy.\n\n**Why it works (first principles).** Failure at scale is rarely one clean component fault — it's an *interaction* between a fault and a load level, so it's invisible until you cross the fault and the load at the same time. Replaying known failures guards against repeats; random breakage covers the modes the designers never imagined. And using the live event stream (who's batting) as a scaling input is the same feedforward idea as #1 — the demand sensor is domain knowledge, not a system metric.\n\n**When & what it costs.** Worth it when failures are costly and rare enough that you'll otherwise never observe them. Cost: you must be able to run destructive tests safely, and it's a long investment before it pays.\n\n---\n\n## New concepts (learned today)\n- **Feedforward vs. feedback scaling (demand-ladder autoscaling)** — when provisioning lag exceeds the timescale of load change, reactive autoscaling on resource metrics always arrives late; instead scale on a leading upstream signal (concurrency) via a pre-benchmarked \"load → units\" table, judged by user-visible latency, not CPU.\n- **Rated capacity** — the benchmarked max requests/sec a single box can serve while still meeting its latency target; paired with a live \"% of rated capacity\" view it turns scaling and shedding into lookups.\n- **Panic mode (priority load-shedding with benign responses)** — a switch that turns off non-critical services under overload and returns OK-shaped responses so upstream doesn't cascade; lets auth/payment fail *open* when wrongly admitting a user is cheaper than wrongly rejecting millions.\n- **Tsunami traffic (surge-and-drop)** — a sharp rise then sharp fall; the fall is dangerous because users shift from cheap (video) to expensive (home-page) request profiles, so backend load can spike as concurrency drops.\n- **Elasticity leaks at provider scale** — \"auto/elastic\" cloud reveals hard limits (capacity shortfalls, one-instance-type groups, control-plane API ceilings, per-LB caps) once you're a visible fraction of the pool; mitigate by diversifying types/zones, pre-baking images, and sharding anything with a ceiling.\n\n## Connections\n- The whole episode is one principle in six costumes: **when you can't react fast enough, you must predict, pre-provision, and pre-decide.** Feedforward scaling (#1), peak-sizing non-elastic tiers (#3), journey-based planning (#4), pre-declared panic modes (#5), and game-day rehearsal (#6) are all \"move the decision earlier in time.\"\n- Load-shedding by priority (#5) is the same shape as a **guardrailed / blast-radius-bounded** deployment: shrink the exposed surface deliberately rather than hope.\n\n## Left out\nOpening record statistics (peak numbers, bandwidth share, comparisons to other platforms) as un-generalisable name-dropping, the cricket and \"we broke the record but lost the match\" colour, and the team-size / tooling Q&A."

    "md": "# How Flipkart built hybrid cloud for scale and cost\n_Hasgeek TV · Sudhir Reddy (Rootconf 2023) · deep-dive (hybrid-cloud economics & architecture) · Read time: ~10 min_\n\n**Theme.** \"Private vs public cloud\" is the wrong frame. Hybrid is a *workload-by-workload* cost-and-lock-in portfolio decision: run steady-state load on hardware you own, rent elastic capacity for spikes, and keep an abstraction layer of your own between apps and any vendor so portability stays a choice.\n\n---\n\n### 1. Pay for the peak, not the baseline — the capacity-shape argument\n_Owning and renting are two different cost curves; which one wins depends entirely on the shape of your demand._\n\n**The setup.** Traffic is spiky (Big Billion Days, flash sales, >1M concurrent). Owning peak capacity year-round \"is not a cost-viable option,\" and renting *everything* costs too much. So: business-as-usual load on-prem, burst into public cloud. (Honest caveat from the talk: they hadn't actually reached bursting yet — it was a year-end target.)\n\n**Why it works (first principles).** Owned capacity has a low marginal cost per core-hour but you pay for it whether used or not. Rented capacity has a high unit price but you pay only while using it. For a load with peak/average ratio P, *owning for the peak* wastes capacity in proportion to P; *renting everything* pays the rental premium on the whole baseline. The cheapest split: own up to the level where an idle owned core-hour costs the same as the rental premium, and rent the spike above it. The higher the peak-to-mean ratio and the shorter the peaks, the more you should rent — cloud elasticity is worth most for *rare, short, very high* peaks and is just a markup for flat load.\n\n**When & what it costs.** The strategy quietly assumes the bursting plumbing works: apps must be location-agnostic, data reachable from both sides, egress/latency tolerable. A hybrid design is only as good as its weakest portability link — usually *state* (the Q&A admitted the stateful tier wasn't ready).\n\n---\n\n### 2. Lock-in is a layer you choose — so build the portable layer yourself\n_You can't eliminate switching cost, but you can concentrate it in a thin layer you own instead of smearing it across thousands of call sites._\n\n**The setup.** Lock-in is \"one of the key significant problems\" (they cite Bigtable, Cosmos DB). So for most workloads they use public cloud as *raw infrastructure only*, running their own KV store, distributed SQL, messaging, CI/CD, metrics and security on Kubernetes + Istio. Apps don't know which cloud they're on. The deliberate exception: the data platform, moved fully onto GCP to try its capabilities — lock-in accepted and abstracted centrally.\n\n**Why it works (first principles).** Switching cost is the sum of every place app code touches a vendor-specific interface. You decide *where* that surface sits — a thin infra layer vs thousands of call sites — and who pays to migrate it. Building your own \"managed\" services on commodity compute converts the vendor from a *platform* into a supplier of *fungible commodity* (VMs, disks, bandwidth), and commodity suppliers compete on price — that's where negotiating leverage comes from. A credible exit option caps what the vendor can charge *even if you never use it*.\n\n**When & what it costs.** You now carry the operating/engineering cost the vendor would have absorbed — only worth it at large scale with a team that can run these systems. The decision is *where* to accept lock-in (high-value, lossy-to-abstract tech) and where not.\n\n---\n\n### 3. Managed services are priced for a *generic* workload — a bespoke layer on your own shape often wins big (and sometimes loses)\n_Cost hides in billing dimensions your architecture didn't design around._\n\n**The setup.** Savings came from replacing/wrapping managed services: Pub/Sub had no compression → they stripped the client, added compression + Avro + batching, −70%. Dataflow ETL was costlier than on-prem → ran Spark Streaming instead, lifting CPU utilisation 30%→90%, −75%. Dataproc's autoscaler was too slow and couldn't mix spot/non-preemptible or pin zones → they built scaling on YARN with zone-pinned node labels (avoiding cross-zone shuffle charges), done by \"a couple of developers in a couple of weeks.\" Bigtable went the *other* way: it replaced self-run HBase, −50%+, and ended cluster firefighting. Net public-cloud spend: −85% from first deployment.\n\n**Why it works (first principles).** A managed service is priced and tuned for the *median* customer. It bundles an operational-convenience premium, defaults that favour the vendor's safety/simplicity (always-on logging, no compression), and billing dimensions (bytes, cross-zone traffic, per-node licences) you didn't design around — so cost hides where your architecture doesn't naturally minimise. At high scale, unit-cost-gap × volume pays for the engineers who write a specialised layer; at low scale it doesn't. Two recurring levers: cost often sits at the *seam between components* (compression, serialization, zone placement) where no vendor team owns it; and *utilisation* is the root metric — 30%→90% CPU is a 3× price-per-work change with no change in the price list. The Bigtable counter-example matters: when a managed service removes large operating cost (disk failures, babysitting), *buying* wins. The rule is TCO including operations, case by case.\n\n**When & what it costs.** Break a cloud bill down by billing dimension before accepting it. Caveat: the 85% is self-reported and measured against their own *first, unoptimised* deployment — part of it is a learning-curve correction, not a vendor flaw.\n\n---\n\n### 4. Performance is a purchased quantity — \"faster doesn't mean better\"\n_Finishing a batch job earlier than its deadline has zero value but real cost._\n\n**The setup.** The recurring rule is to balance performance against cost, not pick the top performer: an AMD/Intel mix skewed to AMD for core density; dense racks; routing a job to BigQuery, Hive, or Spark by whether it truly needs two minutes or can take twenty; Kubernetes on *bare metal* instead of VMs (−30–40% cores for apps); hundreds of flexible VM sizes so nobody over-buys; fast local SSD only where needed.\n\n**Why it works (first principles).** Every system has a cost-vs-latency frontier, and the right operating point depends on the *value of the marginal speed-up*. Most batch work has a deadline; finishing early is worthless but costs money — so minimise cost by pushing each workload to the *slowest, cheapest tier that still meets its real SLA*. Bare metal helps because virtualization taxes every core with a hypervisor layer that Kubernetes isolation makes redundant. Right-sizing, dense packing and network storage are all the same move: raise utilisation by *pooling* so slack isn't stranded in one machine.\n\n**When & what it costs.** Write down each workload's *real* deadline, then buy the cheapest tier that meets it. Cost: heterogeneity to manage (mixed CPUs, engines, sizes).\n\n---\n\n### 5. Disaggregated infrastructure: pool + overcommit to recover stranded capacity\n_Utilisation problems are usually shape problems — different workloads leave different resources idle._\n\n**The setup.** Local HDDs/SSDs were \"massively underutilised,\" so storage moved onto the network (SSD-only; HDDs retired). Apps see only their allocation while the pool is *overprovisioned*. GPUs run time-shared in Kubernetes. Some throughput-critical apps still keep local SSD.\n\n**Why it works (first principles).** Fixed boxes (X cores, Y TB, Z GPU) force each workload to leave a *different* resource idle — storage is rarely consumed in the same ratio as CPU. Pooling storage into a shared layer gives a *statistical-multiplexing* gain: since apps rarely peak together, the pool can promise more than it physically holds (thin provisioning). The price is network hops, a shared failure/contention domain, and latency — which is why throughput-critical apps stay local. (This is the same logic that makes cloud elasticity work at all.)\n\n**When & what it costs.** Pooling + a safe overcommit ratio; the question is which workloads tolerate the extra hop.\n\n---\n\n### 6. Cost visibility is a control loop (FinOps) — and watch the \"unknown-unknown\" bill\n_Cost only gets optimised when the party who can change behaviour sees it, attributed to them, in time to act._\n\n**The setup.** \"The key thing for cost optimization is always billing\": teams get billed so finance can ask the ROI of their spend. Early cloud bills were inflated by *defaults nobody chose* (default logging on), so they built automation surfacing recommendations to developers. New pricing (e.g. a storage-bandwidth subscription) can appear unannounced and be large. Their warning: vendors discount now and raise unit costs once they need profit.\n\n**Why it works (first principles).** Shared invisible cost is a *commons problem* — nobody has a reason to trim it. So cost visibility is a feedback loop: attribute → show → ask for justification → act. Defaults deserve suspicion because they're the *vendor's* choice, not yours. The future-price-rise warning is the economic version of lock-in: a dependency on someone's future pricing power.\n\n**When & what it costs.** Attribute spend to owners, audit every new service's defaults, and value an exit option as a cap on future prices.\n\n---\n\n## New concepts (learned today)\n- **Capacity-shape hybrid split (own the base, rent the peak)** — the cost-optimal owned/rented mix depends on the demand curve's peak-to-mean ratio; own up to where idle-owned cost = rental premium, rent the spiky remainder. Only as good as workload portability — state usually breaks it.\n- **Managed-service generic-workload premium** — managed services are priced/defaulted for the median customer, so cost hides in billing dimensions your architecture doesn't minimise; at scale a bespoke layer removes most of it, but where the service removes big operational burden, buying wins (decide on TCO).\n- **Lock-in surface area** — switching cost = sum of app touchpoints with vendor-specific interfaces; can't be removed but can be concentrated in a thin owned layer; a credible exit caps vendor pricing power.\n- **Thin provisioning via disaggregated storage** — pooling storage/GPUs across the network and promising more than physically held exploits that apps rarely peak together; recovers stranded capacity at the cost of latency and a shared contention domain.\n- **Deadline-matched tiering** — finishing faster than the real deadline has zero value but real cost, so run each workload on the cheapest tier that just meets its SLA.\n- **Partitioned vs failover-capable active-active** — splitting users across two DCs is cheap active-active but doesn't mean either can absorb the other's full load; true resilience needs spare capacity, replicated state with an explicit consistency mode, and tested failover.\n\n## Connections\n- The capacity-shape argument (1) is the mirror image of the **PhonePe** digest this run: PhonePe *owns* because its payments load *ratchets up and stays* (little reversion to monetise with elasticity); Flipkart *rents the spike* because its sale-day load is bursty and reverts. Same first principle (elasticity is worth the reversion you can harvest), opposite conclusions from opposite load shapes — the tension is the lesson.\n- \"Own the portable layer, treat vendors as commodity\" is the infra version of *value sitting in the scarce layer* — and a thick, infra-tied self-built layer is more durable than a thin wrapper.\n\n## Left out\nOpening business stats (user/product counts), company-history narrative, the \"support is easier when you can phone your own people\" aside (a preference), and vendor-partnership details (Taiwan assemblers, DC rebuild cycles)."
